<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --oq-navy: #204b96;
      --oq-blue: #3989f3;
      --oq-blue-soft: #81cbf2;
      --oq-orange: #ed8933;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--homey-text-color, #1c2b3a);
      padding: var(--homey-su-4, 16px);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header svg { flex: 0 0 auto; }
    .wordmark {
      font-size: var(--homey-font-size-default, 17px);
      font-weight: var(--homey-font-weight-bold, 700);
      letter-spacing: 0.06em;
    }
    .wordmark .open { color: var(--oq-blue); }
    .wordmark .quatt { color: var(--oq-orange); }

    .badge {
      margin-left: auto;
      font-size: var(--homey-font-size-small, 14px);
      font-weight: var(--homey-font-weight-medium, 500);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge.idle  { background: rgba(128, 144, 168, 0.18); color: var(--homey-text-color-light, #6b7a8c); }
    .badge.heat  { background: rgba(237, 137, 51, 0.16);  color: var(--oq-orange); }
    .badge.cool  { background: rgba(57, 137, 243, 0.16);  color: var(--oq-blue); }
    .badge.frost { background: rgba(129, 203, 242, 0.20); color: #2d9bc7; }
    .badge.off   { background: rgba(220, 68, 68, 0.14);   color: var(--homey-text-color-danger, #dc4444); }

    .brandline {
      height: 3px;
      border-radius: 2px;
      margin: 10px 0 12px;
      background: linear-gradient(90deg, var(--oq-navy), var(--oq-blue) 45%, var(--oq-blue-soft) 70%, var(--oq-orange));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 10px;
    }
    .stat .label {
      font-size: 13px;
      color: var(--homey-text-color-light, #6b7a8c);
      white-space: nowrap;
    }
    .stat .value {
      font-size: 18px;
      font-weight: var(--homey-font-weight-bold, 700);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .stat .value .unit {
      font-size: 12px;
      font-weight: var(--homey-font-weight-regular, 400);
      color: var(--homey-text-color-light, #6b7a8c);
      margin-left: 1px;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--homey-text-color-light, #6b7a8c);
    }
    .footer .dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--homey-text-color-success, #2fa84f);
    }
    .footer.problem { color: var(--homey-text-color-danger, #dc4444); }
    .footer.problem .dot { background: var(--homey-text-color-danger, #dc4444); }
    .footer .insight {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer .time { margin-left: auto; flex: 0 0 auto; }

    .empty {
      display: none;
      text-align: center;
      padding: 24px 8px;
      color: var(--homey-text-color-light, #6b7a8c);
    }
    body.is-empty .empty { display: block; }
    body.is-empty .grid, body.is-empty .footer, body.is-empty .brandline { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <!-- OpenQuatt druppel-merk -->

    <div class="wordmark"><span class="open">OPEN</span><span class="quatt">QUATT</span></div>
    <div class="badge idle" id="badge">…</div>
  </div>

  <div class="brandline"></div>

  <div class="grid">
    <div class="stat"><div class="label">Aanvoer</div><div class="value" id="supply">—</div></div>
    <div class="stat"><div class="label">Buiten</div><div class="value" id="outside">—</div></div>
    <div class="stat"><div class="label">Kamer</div><div class="value" id="room">—</div></div>
    <div class="stat"><div class="label">Opname</div><div class="value" id="power">—</div></div>
    <div class="stat"><div class="label">Afgifte</div><div class="value" id="output">—</div></div>
    <div class="stat"><div class="label" id="efflabel">COP vandaag</div><div class="value" id="eff">—</div></div>
  </div>

  <div class="footer" id="footer">
    <div class="dot"></div>
    <div class="insight" id="insight"></div>
    <div class="time" id="time"></div>
  </div>

  <div class="empty" id="empty">Geen OpenQuatt-controller gekoppeld</div>

  <script type="text/javascript">
    const MODES = {
      CM0: { label: 'Standby', cls: 'idle' },
      CM1: { label: 'Doorstromen', cls: 'idle' },
      CM2: { label: 'Verwarmen', cls: 'heat' },
      CM3: { label: 'Verwarmen', cls: 'heat' },
      CM4: { label: 'Verwarmen', cls: 'heat' },
      CM5: { label: 'Koelen', cls: 'cool' },
      CM98: { label: 'Antivries', cls: 'frost' },
      CM100: { label: 'Inregelen', cls: 'idle' },
    };

    const $ = id => document.getElementById(id);
    const num = v => (typeof v === 'number' && isFinite(v) ? v : null);

    function fmt(value, unit, decimals) {
      const n = num(value);
      if (n === null) return '—';
      return `${n.toFixed(decimals)}<span class="unit">${unit}</span>`;
    }

    function setBadge(text, cls) {
      const badge = $('badge');
      badge.textContent = text;
      badge.className = `badge ${cls}`;
    }

    function render(status) {
      document.body.classList.toggle('is-empty', !status.paired);
      if (!status.paired) return;

      const t = status.telemetry || {};
      const code = String(status.controlMode || '').split(' ')[0];

      if (!status.available) {
        setBadge('Offline', 'off');
      } else {
        const mode = MODES[code];
        setBadge(mode ? mode.label : (status.controlMode || 'Onbekend'), mode ? mode.cls : 'idle');
      }

      $('supply').innerHTML = fmt(status.supply, '°C', 1);
      $('outside').innerHTML = fmt(status.outside, '°C', 1);
      $('room').innerHTML = fmt(status.room, '°C', 1);
      $('power').innerHTML = fmt(status.power, 'W', 0);

      // Afgifte: warmte of koude, wat er op dit moment geleverd wordt.
      const heat = num(t.heatPower) || 0;
      const cool = num(t.coolPower) || 0;
      $('output').innerHTML = fmt(Math.max(heat, cool), 'W', 0);

      // Rendement van vandaag: EER tijdens koelseizoen, anders COP.
      let eff = num(t.copDaily);
      let effLabel = 'COP vandaag';
      if ((code === 'CM5' || eff === null) && num(t.eerDaily) !== null) {
        eff = num(t.eerDaily);
        effLabel = 'EER vandaag';
      }
      $('efflabel').textContent = effLabel;
      $('eff').innerHTML = fmt(eff, '', 1);

      // Footer: problemen winnen van de dagproductie.
      const problems = status.problems || [];
      const footer = $('footer');
      if (problems.length) {
        footer.classList.add('problem');
        $('insight').textContent = problems[0] + (problems.length > 1 ? ` (+${problems.length - 1})` : '');
      } else {
        footer.classList.remove('problem');
        const delivered = (num(t.thermalDaily) || 0) + (num(t.coolingDaily) || 0);
        const electric = num(t.electricDaily);
        $('insight').textContent = `Vandaag: ${delivered.toFixed(1)} kWh geleverd`
          + (electric !== null ? ` · ${electric.toFixed(1)} kWh stroom` : '');
      }
      $('time').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function onHomeyReady(Homey) {
      Homey.ready();

      let busy = false;
      const refresh = async () => {
        if (busy) return;
        busy = true;
        try {
          render(await Homey.api('GET', '/status', {}));
        } catch (err) {
          setBadge('Offline', 'off');
        } finally {
          busy = false;
        }
      };

      refresh();
      setInterval(refresh, 10000);
    }
  </script>
</body>
</html>
