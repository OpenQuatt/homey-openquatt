<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* The widget itself must never scroll; vertical swipe gestures should
       pass through to the Homey app's dashboard. */
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }

    /* OpenQuatt brand palette: ink and orange on light backgrounds,
       chalk and a brighter orange on dark ones. Homey flags dark mode with
       the .homey-dark-mode class; .oq-dark is our own fallback (see syncTheme). */
    :root {
      --oq-primary: #0f1724;
      --oq-accent: #ea580c;
      --oq-accent-soft: rgba(234, 88, 12, 0.14);
      --oq-cool: #0284c7;
      --oq-cool-soft: rgba(14, 165, 233, 0.14);
      --oq-line: rgba(128, 144, 168, 0.28);
    }
    .homey-dark-mode, .oq-dark {
      --oq-primary: #f8fafc;
      --oq-accent: #f97316;
      --oq-accent-soft: rgba(249, 115, 22, 0.18);
      --oq-cool: #38bdf8;
      --oq-cool-soft: rgba(56, 189, 248, 0.16);
      --oq-line: rgba(148, 163, 184, 0.22);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--homey-text-color, #1c2b3a);
      padding: var(--homey-su-4, 16px);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      flex: 0 0 auto;
      display: block;
      height: 24px;
      width: auto;
    }
    .logo .p { fill: var(--oq-primary); }
    .logo .a { fill: var(--oq-accent); }
    .logo .tail { fill: none; stroke: var(--oq-accent); }

    .badge {
      margin-left: auto;
      font-size: var(--homey-font-size-small, 14px);
      font-weight: var(--homey-font-weight-medium, 500);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge.idle  { background: rgba(128, 144, 168, 0.18); color: var(--homey-text-color-light, #6b7a8c); }
    .badge.heat  { background: var(--oq-accent-soft); color: var(--oq-accent); }
    .badge.cool  { background: var(--oq-cool-soft);   color: var(--oq-cool); }
    .badge.frost { background: var(--oq-cool-soft);   color: var(--homey-text-color-light, #6b7a8c); }
    .badge.off   { background: rgba(220, 68, 68, 0.14);   color: var(--homey-text-color-danger, #dc4444); }

    .brandline {
      position: relative;
      height: 2px;
      border-radius: 1px;
      margin: 10px 0 12px;
      background: var(--oq-line);
    }
    .brandline::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 44px;
      border-radius: 1px;
      background: var(--oq-accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 10px;
    }
    .stat .label {
      font-size: 13px;
      color: var(--homey-text-color-light, #6b7a8c);
      white-space: nowrap;
    }
    .stat .value {
      font-size: 18px;
      font-weight: var(--homey-font-weight-bold, 700);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .stat .value .unit {
      font-size: 12px;
      font-weight: var(--homey-font-weight-regular, 400);
      color: var(--homey-text-color-light, #6b7a8c);
      margin-left: 1px;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--homey-text-color-light, #6b7a8c);
    }
    .footer .dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--homey-text-color-success, #2fa84f);
    }
    .footer.problem { color: var(--homey-text-color-danger, #dc4444); }
    .footer.problem .dot { background: var(--homey-text-color-danger, #dc4444); }
    .footer .insight {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer .time { margin-left: auto; flex: 0 0 auto; }

    .empty {
      display: none;
      text-align: center;
      padding: 24px 8px;
      color: var(--homey-text-color-light, #6b7a8c);
    }
    body.is-empty .empty { display: block; }
    body.is-empty .grid, body.is-empty .footer, body.is-empty .brandline { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <!-- OpenQuatt logo (mark + wordmark); colours follow the theme via CSS -->
    <svg class="logo" viewBox="7.5 9.6 427.6 79.6" role="img" aria-label="OpenQuatt">
      <g transform="translate(2 5) scale(.9)">
        <path class="p" d="M62.118 76.32 A37.25 37.25 0 1 1 77.32 61.118 L67.076 50.874 A23.75 23.75 0 1 0 51.874 66.076 Z"/>
        <path class="tail" d="M53.5 52.5 L83 82" stroke-width="13.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(99 30.472) scale(0.46528)" fill-rule="evenodd">
        <path class="p" transform="translate(0 0)" d="M50 0 A50 50 0 1 1 50 100 A50 50 0 1 1 50 0 Z M50 18 A32 32 0 1 0 50 82 A32 32 0 1 0 50 18 Z"/>
        <path class="p" transform="translate(110 0)" d="M0 30 H18 V37 C25 30 33 28 42 28 C63 28 76 43 76 65 C76 86 62 101 42 101 C32 101 25 98 18 92 V124 H0 Z M38 46 C26 46 18 53 18 65 C18 77 26 84 38 84 C50 84 58 77 58 65 C58 53 50 46 38 46 Z"/>
        <path class="p" transform="translate(192 0)" d="M71 72 H18 C21 82 28 86 38 86 C46 86 51 82 56 77 L69 89 C60 98 50 102 37 102 C14 102 0 87 0 65 C0 44 15 28 37 28 C59 28 72 43 72 65 Z M18 58 H54 C52 48 46 44 37 44 C28 44 21 49 18 58 Z"/>
        <path class="p" transform="translate(272 0)" d="M0 30 H18 V38 C25 31 33 28 43 28 C63 28 70 41 70 59 V100 H52 V62 C52 50 47 45 37 45 C25 45 18 53 18 65 V100 H0 Z"/>
        <path class="a" transform="translate(351 0)" d="M50 0 A50 50 0 1 1 50 100 A50 50 0 1 1 50 0 Z M50 18 A32 32 0 1 0 50 82 A32 32 0 1 0 50 18 Z"/>
        <path class="a" transform="translate(351 0)" d="M49 64 L63 50 L104 91 L90 105 Z"/>
        <path class="a" transform="translate(460 0)" d="M0 30 H18 V68 C18 80 23 85 33 85 C45 85 52 77 52 65 V30 H70 V100 H52 V92 C45 99 37 102 27 102 C7 102 0 89 0 71 Z"/>
        <path class="a" transform="translate(538 0)" d="M4 42 C14 32 25 28 39 28 C60 28 70 39 70 58 V100 H53 V92 C47 99 38 102 27 102 C10 102 0 93 0 79 C0 65 11 57 31 57 H52 C52 48 47 44 37 44 C28 44 22 47 15 53 Z M52 71 H32 C22 71 18 74 18 79 C18 85 22 88 31 88 C43 88 52 81 52 73 Z"/>
        <path class="a" transform="translate(612 0)" d="M13 13 H31 V30 H52 V47 H31 V73 C31 82 34 85 41 85 C45 85 48 84 52 83 V99 C47 101 42 102 36 102 C20 102 13 94 13 77 V47 H0 V30 H13 Z"/>
        <path class="a" transform="translate(668 0)" d="M13 13 H31 V30 H52 V47 H31 V73 C31 82 34 85 41 85 C45 85 48 84 52 83 V99 C47 101 42 102 36 102 C20 102 13 94 13 77 V47 H0 V30 H13 Z"/>
      </g>
    </svg>
    <div class="badge idle" id="badge">…</div>
  </div>

  <div class="brandline"></div>

  <div class="grid">
    <div class="stat"><div class="label" id="l-supply">Supply</div><div class="value" id="supply">—</div></div>
    <div class="stat"><div class="label" id="l-outside">Outside</div><div class="value" id="outside">—</div></div>
    <div class="stat"><div class="label" id="l-room">Room</div><div class="value" id="room">—</div></div>
    <div class="stat"><div class="label" id="l-power">Power in</div><div class="value" id="power">—</div></div>
    <div class="stat"><div class="label" id="l-output">Output</div><div class="value" id="output">—</div></div>
    <div class="stat"><div class="label" id="efflabel">COP today</div><div class="value" id="eff">—</div></div>
  </div>

  <div class="footer" id="footer">
    <div class="dot"></div>
    <div class="insight" id="insight"></div>
    <div class="time" id="time"></div>
  </div>

  <div class="empty" id="empty">No OpenQuatt controller paired</div>

  <script type="text/javascript">
    // UI strings; English is the default, Dutch follows the Homey language.
    const I18N = {
      en: {
        supply: 'Supply',
        outside: 'Outside',
        room: 'Room',
        power: 'Power in',
        output: 'Output',
        copToday: 'COP today',
        eerToday: 'EER today',
        standby: 'Standby',
        circulate: 'Circulate',
        heating: 'Heating',
        cooling: 'Cooling',
        antifreeze: 'Anti-freeze',
        calibrating: 'Calibrating',
        unknown: 'Unknown',
        offline: 'Offline',
        empty: 'No OpenQuatt controller paired',
        today: (delivered, electric) => `Today: ${delivered} kWh delivered`
          + (electric !== null ? ` · ${electric} kWh used` : ''),
      },
      nl: {
        supply: 'Aanvoer',
        outside: 'Buiten',
        room: 'Kamer',
        power: 'Opname',
        output: 'Afgifte',
        copToday: 'COP vandaag',
        eerToday: 'EER vandaag',
        standby: 'Standby',
        circulate: 'Doorstromen',
        heating: 'Verwarmen',
        cooling: 'Koelen',
        antifreeze: 'Antivries',
        calibrating: 'Inregelen',
        unknown: 'Onbekend',
        offline: 'Offline',
        empty: 'Geen OpenQuatt-controller gekoppeld',
        today: (delivered, electric) => `Vandaag: ${delivered} kWh geleverd`
          + (electric !== null ? ` · ${electric} kWh stroom` : ''),
      },
    };

    // Control mode → badge label key and style.
    const MODES = {
      CM0: { key: 'standby', cls: 'idle' },
      CM1: { key: 'circulate', cls: 'idle' },
      CM2: { key: 'heating', cls: 'heat' },
      CM3: { key: 'heating', cls: 'heat' },
      CM4: { key: 'heating', cls: 'heat' },
      CM5: { key: 'cooling', cls: 'cool' },
      CM98: { key: 'antifreeze', cls: 'frost' },
      CM100: { key: 'calibrating', cls: 'idle' },
    };

    let t9n = I18N.en;

    const $ = id => document.getElementById(id);
    const num = v => (typeof v === 'number' && isFinite(v) ? v : null);

    // Homey marks dark mode with the .homey-dark-mode class. As a fallback,
    // derive the theme from the text colour Homey gives us, so the logo and
    // accents follow the dashboard even when that class is not present.
    function syncTheme() {
      const rgb = (getComputedStyle(document.body).color.match(/\d+(\.\d+)?/g) || []).map(Number);
      if (rgb.length < 3) return;
      const luminance = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
      document.documentElement.classList.toggle('oq-dark', luminance > 128);
    }

    function fmt(value, unit, decimals) {
      const n = num(value);
      if (n === null) return '—';
      return `${n.toFixed(decimals)}<span class="unit">${unit}</span>`;
    }

    function setBadge(text, cls) {
      const badge = $('badge');
      badge.textContent = text;
      badge.className = `badge ${cls}`;
    }

    function applyLanguage(language) {
      t9n = I18N[language] || I18N.en;
      $('l-supply').textContent = t9n.supply;
      $('l-outside').textContent = t9n.outside;
      $('l-room').textContent = t9n.room;
      $('l-power').textContent = t9n.power;
      $('l-output').textContent = t9n.output;
      $('empty').textContent = t9n.empty;
    }

    function render(status) {
      applyLanguage(status.language);

      document.body.classList.toggle('is-empty', !status.paired);
      if (!status.paired) return;

      const t = status.telemetry || {};
      const code = String(status.controlMode || '').split(' ')[0];

      if (!status.available) {
        setBadge(t9n.offline, 'off');
      } else {
        const mode = MODES[code];
        setBadge(mode ? t9n[mode.key] : (status.controlMode || t9n.unknown), mode ? mode.cls : 'idle');
      }

      $('supply').innerHTML = fmt(status.supply, '°C', 1);
      $('outside').innerHTML = fmt(status.outside, '°C', 1);
      $('room').innerHTML = fmt(status.room, '°C', 1);
      $('power').innerHTML = fmt(status.power, 'W', 0);

      // Output: heat or cold, whichever is being delivered right now.
      const heat = num(t.heatPower) || 0;
      const cool = num(t.coolPower) || 0;
      $('output').innerHTML = fmt(Math.max(heat, cool), 'W', 0);

      // Today's efficiency: EER during the cooling season, COP otherwise.
      let eff = num(t.copDaily);
      let effLabel = t9n.copToday;
      if ((code === 'CM5' || eff === null) && num(t.eerDaily) !== null) {
        eff = num(t.eerDaily);
        effLabel = t9n.eerToday;
      }
      $('efflabel').textContent = effLabel;
      $('eff').innerHTML = fmt(eff, '', 1);

      // Footer: active problems win over today's production numbers.
      const problems = status.problems || [];
      const footer = $('footer');
      if (problems.length) {
        footer.classList.add('problem');
        $('insight').textContent = problems[0] + (problems.length > 1 ? ` (+${problems.length - 1})` : '');
      } else {
        footer.classList.remove('problem');
        const delivered = (num(t.thermalDaily) || 0) + (num(t.coolingDaily) || 0);
        const electric = num(t.electricDaily);
        $('insight').textContent = t9n.today(
          delivered.toFixed(1),
          electric !== null ? electric.toFixed(1) : null,
        );
      }
      $('time').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function onHomeyReady(Homey) {
      Homey.ready();

      let busy = false;
      const refresh = async () => {
        if (busy) return;
        busy = true;
        syncTheme();
        try {
          render(await Homey.api('GET', '/status', {}));
        } catch (err) {
          setBadge(t9n.offline, 'off');
        } finally {
          busy = false;
        }
      };

      refresh();
      setInterval(refresh, 10000);
    }
  </script>
</body>
</html>
