<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <!-- The page only ever talks to a Homey through Athom's cloud connection. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*.connect.athom.com; img-src data:; base-uri 'none'; form-action 'none'">
  <title>OpenQuatt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* OpenQuatt brand palette, as in the widgets: ink and orange on light
       backgrounds, chalk and a brighter orange on dark ones. */
    :root {
      color-scheme: light dark;
      --bg: #f3f5f8;
      --card: #ffffff;
      --text: #1c2b3a;
      --muted: #6b7a8c;
      --line: rgba(128, 144, 168, 0.28);
      --primary: #0f1724;
      --accent: #ea580c;
      --accent-soft: rgba(234, 88, 12, 0.14);
      --cool: #0284c7;
      --cool-soft: rgba(14, 165, 233, 0.14);
      --idle-soft: rgba(128, 144, 168, 0.18);
      --danger: #dc4444;
      --danger-soft: rgba(220, 68, 68, 0.12);
      --ok: #2fa84f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b111a;
        --card: #141c27;
        --text: #e6edf5;
        --muted: #8fa0b3;
        --line: rgba(148, 163, 184, 0.22);
        --primary: #f8fafc;
        --accent: #f97316;
        --accent-soft: rgba(249, 115, 22, 0.18);
        --cool: #38bdf8;
        --cool-soft: rgba(56, 189, 248, 0.16);
        --idle-soft: rgba(148, 163, 184, 0.16);
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.14);
        --ok: #4ade80;
      }
    }

    html { background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.35;
      padding: 16px;
    }
    .wrap { max-width: 1040px; margin: 0 auto; }

    .header { display: flex; align-items: center; gap: 10px; }
    .logo { display: block; height: 24px; width: auto; flex: 0 0 auto; }
    .logo .p { fill: var(--primary); }
    .logo .a { fill: var(--accent); }
    .logo .tail { fill: none; stroke: var(--accent); }
    .device-name {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      margin-left: auto;
      font-size: 14px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .badge.small { margin-left: 0; font-size: 12px; padding: 2px 8px; }
    .badge.idle  { background: var(--idle-soft);   color: var(--muted); }
    .badge.heat  { background: var(--accent-soft); color: var(--accent); }
    .badge.cool  { background: var(--cool-soft);   color: var(--cool); }
    .badge.frost { background: var(--cool-soft);   color: var(--muted); }
    .badge.off   { background: var(--danger-soft); color: var(--danger); }
    .badge[hidden] { display: none; }

    .brandline {
      position: relative;
      height: 2px;
      border-radius: 1px;
      margin: 12px 0 16px;
      background: var(--line);
    }
    .brandline::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 44px;
      border-radius: 1px;
      background: var(--accent);
    }

    .banner {
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 14px;
      background: var(--danger-soft);
      color: var(--danger);
    }
    .banner.notice { background: var(--idle-soft); color: var(--text); }
    .banner[hidden] { display: none; }
    .banner ul { margin: 4px 0 0 18px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px 16px;
      min-width: 0;
    }
    .card.wide { grid-column: 1 / -1; }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-head h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .card-head .badge { margin-left: auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 10px;
    }
    .sub {
      grid-column: 1 / -1;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: -6px;
    }
    .stat .label {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat .value {
      font-size: 19px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .unit {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      margin-left: 2px;
    }

    .faults {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .faults .dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
    }
    .faults.problem { color: var(--danger); }
    .faults.problem .dot { background: var(--danger); }

    .rows { display: grid; gap: 2px; }
    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .row:last-child { border-bottom: 0; }
    .row .name { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
    .row .val {
      text-align: right;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .val.on { color: var(--ok); font-weight: 600; }

    details > summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      margin-left: auto;
      transition: transform 0.15s;
    }
    details[open] > summary::after { transform: rotate(-135deg); }
    details[open] > summary { margin-bottom: 12px; }
    .count { color: var(--muted); font-size: 13px; }
    .group h3 {
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 2px;
    }

    input {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .search { margin-bottom: 4px; }

    .login { max-width: 380px; margin: 8vh auto 0; }
    .login .card { padding: 20px; }
    .login .logo { height: 28px; margin-bottom: 16px; }
    .login p { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
    .field { display: block; margin-bottom: 12px; }
    .field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .error { color: var(--danger); font-size: 14px; min-height: 1.35em; margin-bottom: 8px; }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      width: 100%;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.link {
      background: none;
      color: var(--muted);
      font-weight: 400;
      padding: 0;
      width: auto;
      text-decoration: underline;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer button { margin-left: auto; }

    [hidden] { display: none !important; }

    @media (max-width: 380px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Sign in -->
    <section class="login" id="login" hidden>
      <form class="card" id="login-form" novalidate>
        <svg class="logo" data-logo viewBox="7.5 9.6 427.6 79.6" role="img" aria-label="OpenQuatt"></svg>
        <p id="t-intro"></p>
        <label class="field"><span id="t-homey"></span>
          <input id="homey-id" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <label class="field"><span id="t-username"></span>
          <input id="username" autocomplete="username" autocapitalize="off" spellcheck="false">
        </label>
        <label class="field"><span id="t-password"></span>
          <input id="password" type="password" autocomplete="current-password">
        </label>
        <div class="error" id="login-error" role="alert"></div>
        <button type="submit" id="sign-in"></button>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dash" hidden>
      <div class="header">
        <svg class="logo" data-logo viewBox="7.5 9.6 427.6 79.6" role="img" aria-label="OpenQuatt"></svg>
        <span class="device-name" id="device-name"></span>
        <span class="badge idle" id="badge">…</span>
      </div>
      <div class="brandline"></div>

      <div class="banner notice" id="stale" hidden></div>
      <div class="banner notice" id="offline" hidden></div>
      <div class="banner" id="problems" hidden></div>

      <div class="cards">
        <div class="card">
          <div class="card-head"><h2 id="t-system"></h2></div>
          <div class="grid" id="system"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2 id="t-power"></h2></div>
          <div class="grid" id="power"></div>
        </div>
        <div class="card" id="unit-hp1" hidden></div>
        <div class="card" id="unit-hp2" hidden></div>
        <div class="card">
          <div class="card-head"><h2 id="t-status"></h2></div>
          <div class="rows" id="status"></div>
        </div>
        <details class="card wide" id="all">
          <summary class="card-head"><h2 id="t-all"></h2><span class="count" id="all-count"></span></summary>
          <input class="search" id="search" type="search" autocomplete="off">
          <div id="entities"></div>
        </details>
      </div>

      <div class="footer">
        <span id="updated"></span>
        <span id="t-readonly"></span>
        <button type="button" class="link" id="sign-out"></button>
      </div>
    </section>

  </div>

  <script>
    'use strict';

    const APP_ID = 'nl.openquatt';
    const POLL_MS = 5000;
    const HOMEY_ID = /^[0-9a-f]{24}$/;
    const STORE_KEY = 'openquatt-remote';

    // OpenQuatt logo (mark + wordmark), as in the widgets; colours follow the theme.
    const LOGO = `

      </g>`;

    // UI strings; Dutch for Dutch browsers, English otherwise.
    const I18N = {

    // System control mode → badge, as in the status widget.
    const MODES = {
      CM0: { key: 'standby', cls: 'idle' },
      CM1: { key: 'circulate', cls: 'idle' },
      CM2: { key: 'heating', cls: 'heat' },
      CM3: { key: 'heating', cls: 'heat' },
      CM4: { key: 'heating', cls: 'heat' },
      CM5: { key: 'cooling', cls: 'cool' },
      CM98: { key: 'antifreeze', cls: 'frost' },
      CM100: { key: 'calibrating', cls: 'idle' },
    };

    // Unit working mode → badge, as in the heat pump widget.
    const UNIT_MODES = {
      Standby: { key: 'standby', cls: 'idle' },
      Heating: { key: 'heating', cls: 'heat' },
      Cooling: { key: 'cooling', cls: 'cool' },
      Defrost: { key: 'defrost', cls: 'frost' },
    };

    // Protective routines the firmware lists among the failures without them
    // being a fault; the web app and the widgets do not warn about them.
    const NOT_A_FAULT = ['compressor oil return'];

    const DOMAIN_ORDER = ['sensor', 'binary_sensor', 'text_sensor', 'switch', 'select', 'number'];

    const lang = (navigator.language || '').toLowerCase().startsWith('nl') ? 'nl' : 'en';
    const t9n = I18N[lang];
    document.documentElement.lang = lang;

    const $ = id => document.getElementById(id);
    const num = v => (typeof v === 'number' && isFinite(v) ? v : null);

    // Everything that comes from the controller is text, never markup.
    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    function decimal(value, decimals) {
      return value.toLocaleString(lang, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function fmt(value, unit, decimals) {
      const n = num(value);
      if (n === null) return '—';
      return `${decimal(n, decimals)}${unit ? `<span class="unit">${unit}</span>` : ''}`;
    }

    function stat(label, value) {
      return `<div class="stat"><div class="label">${esc(label)}</div><div class="value">${value}</div></div>`;
    }

    function row(name, value, cls = '') {
      return `<div class="row"><span class="name">${esc(name)}</span><span class="val ${cls}">${esc(value)}</span></div>`;
    }

    function time(date) {
      return date.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function unitFaults(list) {
      if (typeof list !== 'string' || list === 'None') return [];
      return list.split(',')
        .map(item => item.trim())
        .filter(item => item && !NOT_A_FAULT.includes(item.toLowerCase()));
    }

    // --- Session ----------------------------------------------------------

    const storage = {
      load() {
        try {
          return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
        } catch (err) {
          return {};
        }
      },
      save(value) {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(value));
        } catch (err) { /* private mode: the session lasts for this tab only */ }
      },
    };

    let session = storage.load();
    // A link to another Homey than the remembered one starts afresh.
    const linkedId = location.hash.slice(1).trim().toLowerCase();
    if (HOMEY_ID.test(linkedId) && linkedId !== session.homeyId) session = { homeyId: linkedId };

    async function call(path, body) {
      const url = `https://${session.homeyId}.connect.athom.com/api/app/${APP_ID}${path}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        cache: 'no-store',
        credentials: 'omit',
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // --- Views ------------------------------------------------------------

    function showLogin(message = '') {
      stopPolling();
      $('dash').hidden = true;
      $('login').hidden = false;
      $('homey-id').value = session.homeyId || '';
      $('login-error').textContent = message;
      (session.homeyId ? $('username') : $('homey-id')).focus();
    }

    function showDashboard() {
      $('login').hidden = true;
      $('dash').hidden = false;
      $('password').value = '';
      startPolling();
    }

    $('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const homeyId = $('homey-id').value.trim().toLowerCase();
      if (!HOMEY_ID.test(homeyId)) {
        $('login-error').textContent = t9n.invalidId;
        return;
      }
      session = { homeyId };

      const button = $('sign-in');
      button.disabled = true;
      button.textContent = t9n.signingIn;
      $('login-error').textContent = '';
      try {
        const result = await call('/remote/login', {
          username: $('username').value,
          password: $('password').value,
        });
        if (result.token) {
          session.token = result.token;
          storage.save(session);
          showDashboard();
        } else {
          $('login-error').textContent = t9n[result.error] || t9n.unauthorized;
        }
      } catch (err) {
        $('login-error').textContent = t9n.unreachable;
      } finally {
        button.disabled = false;
        button.textContent = t9n.signIn;
      }
    });

    $('sign-out').addEventListener('click', () => {
      call('/remote/logout', { token: session.token }).catch(() => {});
      session = { homeyId: session.homeyId };
      storage.save(session);
      lastState = null;
      showLogin();
    });

    // --- Polling ----------------------------------------------------------

    let pollTimer = null;
    let polling = false;
    let lastOk = null;
    let lastState = null;

    function startPolling() {
      stopPolling();
      poll();
    }

    function stopPolling() {
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    async function poll() {
      clearTimeout(pollTimer);
      if (polling || !session.token) return;
      // A hidden tab does not poll; it catches up when it is shown again.
      if (document.hidden) return;
      polling = true;
      try {
        const result = await call('/remote/state', { token: session.token, entities: $('all').open });
        if (result.error) {
          session = { homeyId: session.homeyId };
          storage.save(session);
          lastState = null;
          showLogin(t9n.expired);
          return;
        }
        lastOk = new Date();
        lastState = result.state;
        $('stale').hidden = true;
        render(result.state);
      } catch (err) {
        if (lastOk) {
          $('stale').textContent = t9n.stale(time(lastOk));
          $('stale').hidden = false;
        } else {
          $('stale').textContent = t9n.unreachable;
          $('stale').hidden = false;
        }
      } finally {
        polling = false;
        if (session.token) pollTimer = setTimeout(poll, POLL_MS);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && session.token && !$('dash').hidden) poll();
    });

    $('all').addEventListener('toggle', () => {
      if ($('all').open) {
        $('entities').innerHTML = `<div class="row"><span class="name">${esc(t9n.loading)}</span></div>`;
        poll();
      }
    });

    $('search').addEventListener('input', () => {
      if (lastState) renderEntities(lastState.entities);
    });

    // --- Rendering --------------------------------------------------------

    function setBadge(label, cls) {
      $('badge').textContent = label;
      $('badge').className = `badge ${cls}`;
    }

    function render(state) {
      const cap = id => (state.capabilities && id in state.capabilities ? state.capabilities[id] : null);
      const t = state.telemetry || {};
      const code = t.controlModeCode;
      const cooling = code === 'CM5';

      // The default name would only repeat the logo.
      $('device-name').textContent = /^openquatt$/i.test(state.name || '') ? '' : state.name;
      const mode = MODES[code];
      if (!state.available) setBadge(t9n.offlineBadge, 'off');
      else setBadge(mode ? t9n[mode.key] : (cap('oq_control_mode') || t9n.unknown), mode ? mode.cls : 'idle');
      $('offline').textContent = t9n.offline;
      $('offline').hidden = state.available !== false;

      // Problems: the system-wide faults and each unit's own failures.
      const problems = [];
      if (t.lowflowFault) problems.push(t9n.lowflow);
      if (t.flowMismatch) problems.push(t9n.flowMismatch);
      if (t.otLinkProblem) problems.push(t9n.otLink);
      for (const unit of ['hp1', 'hp2']) {
        const hp = state.heatpumps && state.heatpumps[unit];
        for (const fault of unitFaults(hp && hp.failures)) problems.push(`${unit.toUpperCase()}: ${fault}`);
      }
      $('problems').innerHTML = problems.length
        ? `${esc(t9n.problems)}<ul>${problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : '';
      $('problems').hidden = problems.length === 0;

      $('system').innerHTML = [
        stat(t9n.supply, fmt(cap('measure_temperature.supply'), '°C', 1)),
        stat(t9n.return, fmt(cap('measure_temperature.return'), '°C', 1)),
        stat(t9n.target, fmt(cap('measure_temperature.supply_target'), '°C', 1)),
        stat(t9n.outside, fmt(cap('measure_temperature.outside'), '°C', 1)),
        stat(t9n.room, fmt(cap('measure_temperature.room'), '°C', 1)),
        stat(t9n.setpoint, fmt(cap('measure_temperature.setpoint'), '°C', 1)),
        stat(t9n.flow, fmt(cap('oq_flow'), 'L/h', 0)),
        stat(t9n.dewPoint, fmt(cap('measure_temperature.dew_point'), '°C', 1)),
      ].join('');

      // Output is heat or cold, whichever is delivered right now; efficiency
      // the EER while cooling and the COP otherwise.
      const heat = num(cap('oq_heat_power'));
      const cool = num(cap('oq_cool_power'));
      const output = heat === null && cool === null ? null : Math.max(heat || 0, cool || 0);
      let daily = num(t.copDaily);
      let dailyLabel = t9n.cop;
      if ((cooling || daily === null) && num(t.eerDaily) !== null) {
        daily = num(t.eerDaily);
        dailyLabel = t9n.eer;
      }
      const delivered = num(t.thermalDaily) === null && num(t.coolingDaily) === null
        ? null : (num(t.thermalDaily) || 0) + (num(t.coolingDaily) || 0);
      $('power').innerHTML = [
        `<div class="sub">${esc(t9n.now)}</div>`,
        stat(t9n.powerIn, fmt(cap('measure_power'), 'W', 0)),
        stat(t9n.output, fmt(output, 'W', 0)),
        stat(cooling ? t9n.eer : t9n.cop, fmt(cooling ? cap('oq_eer') : cap('oq_cop'), '', 1)),
        `<div class="sub">${esc(t9n.today)}</div>`,
        stat(t9n.delivered, fmt(delivered, 'kWh', 1)),
        stat(t9n.used, fmt(t.electricDaily, 'kWh', 1)),
        stat(dailyLabel, fmt(daily, '', 1)),
      ].join('');

      for (const unit of ['hp1', 'hp2']) renderUnit(unit, state.heatpumps && state.heatpumps[unit]);

      const pill = value => {
        if (value === null || value === undefined) return ['—', ''];
        return value ? [t9n.on, 'on'] : [t9n.off, ''];
      };
      const rows = [
        [t9n.mode, cap('oq_control_mode') || '—', ''],
        [t9n.openquatt, ...pill(cap('onoff.openquatt'))],
        [t9n.heatingPermission, ...pill(cap('oq_heating_permitted'))],
        [t9n.coolingPermission, ...pill(cap('oq_cooling_permitted'))],
        [t9n.manualCooling, ...pill(cap('onoff.cooling'))],
        [t9n.auxRelay, ...pill(cap('onoff.aux_relay'))],
      ];
      if (cap('oq_aux_status')) rows.push([t9n.auxStatus, cap('oq_aux_status'), '']);
      if (t.coolingBlockReason && t.coolingBlockReason !== 'None') {
        rows.push([t9n.coolingBlock, t.coolingBlockReason, '']);
      }
      $('status').innerHTML = rows.map(([name, value, cls]) => row(name, value, cls)).join('');

      if ($('all').open && state.entities) renderEntities(state.entities);
      $('updated').textContent = t9n.updated(time(new Date()));
    }

    function renderUnit(unit, hp) {
      const card = $(`unit-${unit}`);
      card.hidden = !hp;
      if (!hp) return;

      const defrosting = hp.defrost === true || hp.mode === 'Defrost';
      const mode = UNIT_MODES[defrosting ? 'Defrost' : hp.mode];
      const cooling = hp.mode === 'Cooling' && !defrosting;
      const heat = num(hp.heatPower);
      const cool = num(hp.coolPower);
      const output = heat === null && cool === null ? null : Math.max(heat || 0, cool || 0);
      const faults = unitFaults(hp.failures);

      card.innerHTML = `
        <div class="card-head">
          <h2>${unit.toUpperCase()}</h2>
          <span class="badge small ${mode ? mode.cls : 'idle'}">${esc(mode ? t9n[mode.key] : (hp.mode || t9n.unknown))}</span>
        </div>
        <div class="grid">
          ${stat(t9n.supply, fmt(hp.waterOut, '°C', 1))}
          ${stat(t9n.return, fmt(hp.waterIn, '°C', 1))}
          ${stat(t9n.flow, fmt(hp.flow, 'L/h', 0))}
          ${stat(t9n.compressor, fmt(hp.frequency, 'Hz', 0))}
          ${stat(t9n.fan, fmt(hp.fanSpeed, 'RPM', 0))}
          ${stat(t9n.air, fmt(hp.outside, '°C', 1))}
          ${stat(t9n.powerIn, fmt(hp.power, 'W', 0))}
          ${stat(t9n.output, fmt(output, 'W', 0))}
          ${stat(cooling ? t9n.eer : t9n.cop, fmt(cooling ? hp.eer : hp.cop, '', 1))}
        </div>
        <div class="faults ${faults.length ? 'problem' : ''}">
          <span class="dot"></span><span>${esc(faults.length ? faults.join(', ') : t9n.noFaults)}</span>
        </div>`;
    }

    // Every entity the controller reports, grouped by kind, as it formats them.
    function renderEntities(entities) {
      if (!Array.isArray(entities)) return;
      const query = $('search').value.trim().toLowerCase();
      const groups = {};
      let total = 0;
      for (const entity of entities) {
        if (entity.state === null || entity.state === undefined) continue;
        const separator = entity.id.indexOf('-');
        const domain = entity.id.slice(0, separator);
        const name = entity.name || entity.id.slice(separator + 1);
        total++;
        if (query && !`${name} ${entity.state}`.toLowerCase().includes(query)) continue;
        const key = DOMAIN_ORDER.includes(domain) ? domain : 'other';
        (groups[key] = groups[key] || []).push({ name, state: entity.state });
      }
      $('all-count').textContent = String(total);

      const html = [...DOMAIN_ORDER, 'other']
        .filter(key => groups[key])
        .map(key => `<div class="group"><h3>${esc(t9n.domains[key])}</h3><div class="rows">${
          groups[key]
            .sort((a, b) => a.name.localeCompare(b.name, lang, { numeric: true }))
            .map(entity => row(entity.name, entity.state))
            .join('')
        }</div></div>`)
        .join('');
      $('entities').innerHTML = html || `<div class="row"><span class="name">${esc(t9n.nothing)}</span></div>`;
    }

    // --- Start ------------------------------------------------------------

    for (const logo of document.querySelectorAll('[data-logo]')) logo.innerHTML = LOGO;
    $('t-intro').textContent = t9n.intro;
    $('t-homey').textContent = t9n.homey;
    $('t-username').textContent = t9n.username;
    $('t-password').textContent = t9n.password;
    $('sign-in').textContent = t9n.signIn;
    $('sign-out').textContent = t9n.signOut;
    $('t-readonly').textContent = t9n.readOnly;
    $('t-system').textContent = t9n.system;
    $('t-power').textContent = t9n.power;
    $('t-status').textContent = t9n.status;
    $('t-all').textContent = t9n.all;
    $('search').placeholder = t9n.search;

    if (session.homeyId && session.token) showDashboard();
    else showLogin();
  </script>
</body>
</html>
