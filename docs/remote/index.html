<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f1724">
  <!-- The page only ever talks to a Homey through Athom's cloud connection. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*.connect.athom.com; img-src data:; base-uri 'none'; form-action 'none'">
  <title>OpenQuatt</title>
  <style>
    /* Tokens follow the OpenQuatt web app: a warm page, a soft shell, white
       cards, an orange accent, and the overview's meaningful tones (blue for
       electrical, orange for heat, green for efficiency, sky for flow). */
    :root {
      color-scheme: light;
      --page: linear-gradient(180deg, #f6f2ea 0%, #f8fafc 100%);
      --page-solid: #f6f2ea;
      --shell: #f9fafb;
      --card: #ffffff;
      --card-muted: #f3f4f6;
      --line: #e5e7eb;
      --line-soft: rgba(229, 231, 235, 0.7);
      --ink: #111827;
      --soft: #4b5563;
      --faint: #6b7280;
      --accent: #ea580c;
      --accent-deep: #c2410c;
      --accent-soft: #fff7ed;
      --accent-line: rgba(234, 88, 12, 0.3);
      --blue: #2563eb;
      --orange: #ea580c;
      --green: #16a34a;
      --sky: #0284c7;
      --amber: #f59e0b;
      --emerald: #10b981;
      --slate: #94a3b8;
      --hot: #dc2626;
      --cold: #2563eb;
      --ok: #16a34a;
      --ok-bg: #f0fdf4;
      --ok-line: rgba(22, 163, 74, 0.3);
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-line: rgba(217, 119, 6, 0.28);
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-line: rgba(220, 38, 38, 0.24);
      --heat-bg: #fff7ed;
      --heat-line: rgba(234, 88, 12, 0.18);
      --heat-ink: #c2410c;
      --cool-bg: #eff6ff;
      --cool-line: rgba(37, 99, 235, 0.16);
      --cool-ink: #1d4ed8;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 14px 40px rgba(15, 23, 42, 0.05);
      --grid: rgba(148, 163, 184, 0.3);
      --r-lg: 16px;
      --r-md: 12px;
      --r-sm: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0f1724;
        --page-solid: #0f1724;
        --shell: #162131;
        --card: #1c2a3d;
        --card-muted: #243449;
        --line: rgba(148, 163, 184, 0.24);
        --line-soft: rgba(148, 163, 184, 0.16);
        --ink: #f8fafc;
        --soft: #dbe4ef;
        --faint: #aec0d4;
        --accent: #f97316;
        --accent-deep: #fb923c;
        --accent-soft: rgba(249, 115, 22, 0.14);
        --accent-line: rgba(249, 115, 22, 0.36);
        --blue: #60a5fa;
        --orange: #fb923c;
        --green: #4ade80;
        --sky: #38bdf8;
        --hot: #f87171;
        --cold: #60a5fa;
        --ok: #4ade80;
        --ok-bg: rgba(20, 83, 45, 0.28);
        --ok-line: rgba(74, 222, 128, 0.3);
        --warn: #fbbf24;
        --warn-bg: rgba(120, 53, 15, 0.3);
        --warn-line: rgba(251, 191, 36, 0.3);
        --danger: #fca5a5;
        --danger-bg: rgba(127, 29, 29, 0.32);
        --danger-line: rgba(248, 113, 113, 0.32);
        --heat-bg: rgba(249, 115, 22, 0.1);
        --heat-line: rgba(249, 115, 22, 0.26);
        --heat-ink: #fdba74;
        --cool-bg: rgba(59, 130, 246, 0.12);
        --cool-line: rgba(96, 165, 250, 0.26);
        --cool-ink: #93c5fd;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.16), 0 24px 56px rgba(2, 6, 23, 0.2);
        --grid: rgba(148, 163, 184, 0.2);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--page-solid); }
    body {
      min-height: 100vh;
      padding: 18px 0 36px;
      background: var(--page);
      color: var(--ink);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px;
      background: var(--shell);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
    }

    /* Header */
    .head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .logo { display: block; width: clamp(170px, 22vw, 230px); height: auto; }
    .logo .p { fill: var(--ink); }
    .logo .a { fill: var(--accent); }
    .logo .tail { fill: none; stroke: var(--accent); }
    .lead { grid-column: 1 / -1; color: var(--soft); }
    .head-side { display: flex; align-items: center; gap: 10px; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--soft);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--slate);
    }
    .live.is-ok::before { background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16); animation: pulse 2.4s ease-in-out infinite; }
    .live.is-off::before { background: #ef4444; }
    .live.is-stale::before { background: var(--amber); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0.04); } }
    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--card);
      color: var(--soft);
      cursor: pointer;
    }
    .icon-btn:hover:not(:disabled) { border-color: var(--accent-line); color: var(--accent-deep); }
    .icon-btn:disabled { opacity: 0.4; cursor: default; }
    svg.icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin: 18px 0;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--card);
      color: var(--soft);
      font-weight: 600;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
    }
    .tab:hover { border-color: rgba(234, 88, 12, 0.24); }
    .tab.is-active {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent-deep);
    }

    /* Banners */
    .banner {
      margin-bottom: 14px;
      padding: 12px 16px;
      border: 1px solid var(--warn-line);
      border-radius: var(--r-md);
      background: var(--warn-bg);
      font-size: 14px;
    }
    .banner strong { display: block; margin-bottom: 2px; color: var(--warn); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .banner.is-danger { border-color: var(--danger-line); background: var(--danger-bg); }
    .banner.is-danger strong { color: var(--danger); }
    .banner ul { margin-left: 18px; }

    /* Panels and type */
    .panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background: var(--card);
    }
    .stack > * + * { margin-top: 16px; }
    .kicker {
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1, h2 { font-size: 1.35rem; line-height: 1.2; letter-spacing: -0.01em; }
    h3 { font-size: 1.05rem; line-height: 1.3; }
    .sub { margin: 18px 0 10px; font-size: 0.95rem; font-weight: 700; }
    .panel-lead { margin-top: 6px; color: var(--soft); }
    .row { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .muted { color: var(--faint); }

    /* Stat cards, as in the OpenQuatt overview */
    .stats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stat {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--card);
      overflow: hidden;
    }
    .stat-label {
      color: var(--tone, var(--soft));
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.35;
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .u { margin-left: 3px; color: var(--faint); font-size: 0.8em; font-weight: 600; }
    .stat-note { color: var(--soft); font-size: 0.8rem; line-height: 1.4; }
    .stat-note:empty { display: none; }
    .stat.is-text .stat-value { font-size: 0.95rem; line-height: 1.35; overflow-wrap: break-word; hyphens: auto; }
    .stat.blue { --tone: var(--blue); --bar: linear-gradient(180deg, #1d4ed8, #60a5fa); }
    .stat.orange { --tone: var(--orange); --bar: linear-gradient(180deg, #f59e0b, #ef4444); }
    .stat.green { --tone: var(--green); --bar: linear-gradient(180deg, #16a34a, #4ade80); }
    .stat.sky { --tone: var(--sky); --bar: linear-gradient(180deg, #0ea5e9, #67e8f9); }
    .stat.accented { padding-left: 21px; }
    .stat.accented::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--bar, var(--tone));
    }
    .stat.accented .stat-label { color: var(--soft); }

    .live-grid { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }

    /* Status cards: a read-only take on the web app's controls */
    .controls { display: grid; gap: 10px; }
    .control {
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--card);
    }
    .control-head { display: flex; align-items: center; gap: 10px; }
    .control-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--soft);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .control-name::before {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #cbd5e1;
      box-shadow: 0 0 0 4px rgba(203, 213, 225, 0.16);
    }
    .control.is-on .control-name::before { background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16); }
    .control-note { margin-top: 5px; color: var(--soft); font-size: 0.86rem; }

    .pill {
      display: inline-flex;
      align-items: center;
      margin-left: auto;
      padding: 2px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--soft);
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill.on { border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok); }
    .pill.heat { border-color: var(--heat-line); background: var(--heat-bg); color: var(--heat-ink); }
    .pill.cool { border-color: var(--cool-line); background: var(--cool-bg); color: var(--cool-ink); }
    .pill.frost { border-color: var(--cool-line); background: var(--cool-bg); color: var(--soft); }
    .pill.off { border-color: var(--danger-line); background: var(--danger-bg); color: var(--danger); }

    /* Heating curve */
    .target {
      margin-top: 14px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
    }
    .target .stat-label { color: var(--soft); }
    .target-value { margin: 4px 0 2px; font-size: 2.3rem; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .target-value .u { font-size: 0.55em; }
    .gauge { position: relative; height: 8px; margin: 16px 0 6px; border-radius: 999px; background: linear-gradient(90deg, rgba(59, 130, 246, 0.22), rgba(249, 115, 22, 0.24)); }
    .gauge i { position: absolute; top: -5px; width: 4px; height: 18px; border-radius: 2px; transform: translateX(-2px); transition: left 400ms ease; }
    .gauge .is-target { background: var(--ink); }
    .gauge .is-supply { background: var(--orange); }
    .gauge .is-return { background: var(--blue); }
    .gauge-scale { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 0.74rem; font-variant-numeric: tabular-nums; }
    .gauge-scale > span:nth-child(2) { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 12px; }
    .target + .stats { margin-top: 10px; }

    /* Key/value lists */
    .list { display: grid; }
    .list-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }
    .list-row:last-child { border-bottom: 0; }
    /* Labels wrap between words, never inside one; a long value wraps instead. */
    .list-row span { flex: 0 1 auto; min-width: min-content; color: var(--soft); }
    .list-row strong { flex: 0 1 auto; min-width: 0; font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: break-word; }
    .list-row strong.on { color: var(--ok); }
    .list.compact .list-row { padding: 7px 0; font-size: 0.9rem; }

    /* Heat pump cards on the overview */
    .units-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 26px 0 12px; }
    .units-head p { color: var(--soft); }
    .ghost-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--soft);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .ghost-btn:hover { border-color: var(--accent-line); color: var(--accent-deep); }
    .units { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .unit-head { display: flex; align-items: center; gap: 10px; }
    .unit-head h3 { font-size: 1.2rem; }
    .hp-head .pill { margin-left: 0; }
    .hp-head .muted { margin-left: auto; font-size: 0.85rem; }
    .unit-art {
      margin: 12px 0 14px;
      padding: 20px 12px 10px;
      border-radius: var(--r-md);
      background:
        radial-gradient(ellipse at 50% 92%, var(--glow, rgba(148, 163, 184, 0.16)), transparent 64%),
        var(--card-muted);
      transition: background 600ms ease;
    }
    .unit.is-heat .unit-art { --glow: rgba(249, 115, 22, 0.3); }
    .unit.is-cool .unit-art { --glow: rgba(59, 130, 246, 0.28); }
    .unit.is-frost .unit-art { --glow: rgba(125, 211, 252, 0.36); }
    .unit-art svg { display: block; width: min(100%, 290px); height: auto; margin: 0 auto; }
    .unit-water {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 18px;
      margin-top: 8px;
      color: var(--soft);
      font-size: 0.84rem;
      font-variant-numeric: tabular-nums;
    }
    .unit-water b { font-weight: 700; }
    .unit-water .hot b { color: var(--hot); }
    .unit-water .cold b { color: var(--cold); }
    .unit .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .unit .stat { padding: 10px 12px; }
    .unit .stat-value { font-size: 1.05rem; }
    .unit-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--soft); font-size: 0.86rem; }
    .unit-foot::before { content: ""; width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: #22c55e; }
    .unit-foot.is-problem { color: var(--danger); }
    .unit-foot.is-problem::before { background: #ef4444; }

    /* The outdoor unit drawing */
    .ou-slat { stroke: rgba(255, 255, 255, 0.13); stroke-width: 1.6; }
    .ou-blade { fill: #424b59; }
    .ou-led { fill: #64748b; transition: fill 400ms ease; }
    .unit.is-heat .ou-led { fill: #fb923c; }
    .unit.is-cool .ou-led { fill: #60a5fa; }
    .unit.is-frost .ou-led { fill: #bae6fd; }
    .ou-snow { opacity: 0; transition: opacity 400ms ease; }
    .unit.is-frost .ou-snow { opacity: 1; }
    .spin { animation: spin var(--spin, 2s) linear infinite; animation-play-state: paused; }
    .is-spinning .spin { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Heat pump schematic, in the web app's dark board style */
    .hp-body {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      margin-top: 14px;
    }
    .board {
      container-type: inline-size;
      padding: 14px;
      border: 1px solid rgba(71, 85, 105, 0.42);
      border-radius: 22px;
      background: linear-gradient(180deg, #1b2230, #161c28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    .board svg { display: block; width: 100%; height: auto; }
    .sx-frame { fill: rgba(17, 24, 39, 0.24); stroke: rgba(100, 116, 139, 0.34); stroke-width: 1.5; stroke-dasharray: 8 10; }
    .sx-title { fill: #f8fafc; font-size: 15px; font-weight: 700; }
    .sx-cap { fill: #8fa1b8; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
    .sx-val { fill: #f1f5f9; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sx-val.small { font-size: 11.5px; }
    .sx-val.big { font-size: 17px; }
    .sx-val.hot { fill: #fca5a5; }
    .sx-val.cold { fill: #93c5fd; }
    .sx-val.ref, .sx-val .ref { fill: #bbf7d0; }
    .sx-shell { fill: #0f172a; stroke: rgba(148, 163, 184, 0.36); stroke-width: 1.5; }
    .sx-fin { stroke: rgba(148, 163, 184, 0.2); stroke-width: 1.2; }
    .sx-ref { fill: none; stroke: #22c55e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(74, 222, 128, 0.5)); transition: stroke 400ms ease; }
    .sx-water { fill: none; stroke-width: 6; stroke-linecap: round; }
    .sx-water.hot { stroke: #ef4444; }
    .sx-water.cold { stroke: #3b82f6; }
    .sx-flow { fill: none; stroke: rgba(255, 255, 255, 0.72); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 2 14; opacity: 0; }
    .is-running .sx-flow.ref { opacity: 1; animation: dash var(--speed, 1.2s) linear infinite; }
    .is-flowing .sx-flow.water { opacity: 1; animation: dash var(--water-speed, 1.4s) linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    .sx-comp { fill: #0f172a; stroke: #475569; stroke-width: 3; transition: stroke 400ms ease; }
    .is-running .sx-comp { stroke: #4ade80; filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.45)); }
    .sx-valve { fill: #0f172a; stroke: #22c55e; stroke-width: 2.5; stroke-linejoin: round; transition: stroke 400ms ease; }
    .sx-fan-ring { fill: rgba(15, 23, 42, 0.7); stroke: rgba(148, 163, 184, 0.4); stroke-width: 1.5; }
    .sx-blade { fill: #64748b; transition: fill 400ms ease; }
    .is-spinning .sx-blade { fill: #a3b1c4; }
    .sx-snow { opacity: 0; transition: opacity 400ms ease; }
    .is-defrost .sx-snow { opacity: 1; }
    .is-defrost .sx-ref, .is-defrost .sx-valve { stroke: #7dd3fc; filter: drop-shadow(0 0 4px rgba(125, 211, 252, 0.55)); }
    .is-off .sx-ref, .is-off .sx-valve { stroke: #475569; filter: none; }
    .board-stats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 12px; }
    @container (min-width: 560px) {
      .board-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .board-stat { min-width: 0; padding: 12px 14px; border: 1px solid rgba(124, 141, 165, 0.22); border-radius: 14px; background: rgba(35, 47, 63, 0.96); }
    .board-stat span { display: block; color: #b0bed0; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .board-stat strong { display: block; margin-top: 6px; color: #f8fafc; font-size: 1.02rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .details { columns: 2; column-gap: 22px; }
    .details > div { break-inside: avoid; }
    .details > div + div h4 { margin-top: 14px; }
    .details h4 { margin: 0 0 2px; color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

    /* Energy */
    .flows { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
    .flow-col { padding: 14px; border: 1px solid var(--line); border-radius: var(--r-md); }
    .flow-col > h4 { margin-bottom: 10px; color: var(--soft); font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .flow-box { padding: 10px 12px 6px; border: 1px solid var(--heat-line); border-radius: var(--r-md); background: var(--heat-bg); }
    .flow-box + .flow-box { margin-top: 10px; }
    .flow-box.cool { border-color: var(--cool-line); background: var(--cool-bg); }
    .flow-box > p {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--heat-ink);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .flow-box.cool > p { color: var(--cool-ink); }
    .flow-box > p::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .flow-box h5 { margin-top: 8px; font-size: 0.92rem; }
    .flow-box .list-row { padding: 5px 0; font-size: 0.88rem; border-color: var(--line-soft); }

    .seg {
      display: inline-flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card-muted);
    }
    .seg button {
      min-width: 76px;
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 9px;
      background: none;
      color: var(--soft);
      font-weight: 650;
      cursor: pointer;
    }
    .seg button.is-active { background: var(--accent-soft); color: var(--accent-deep); box-shadow: inset 0 0 0 1px var(--accent-line); }
    .history-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 14px; }
    .pager { display: flex; align-items: center; gap: 8px; }
    .pager strong { min-width: 170px; text-align: center; font-size: 0.92rem; }
    .share { margin: 14px 0 4px; }
    .share-bar { display: flex; height: 22px; overflow: hidden; border-radius: 999px; background: var(--card-muted); }
    .share-bar i { display: block; height: 100%; transition: width 400ms ease; }
    .share-legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; color: var(--soft); font-size: 0.86rem; }
    .dot { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; }

    /* Charts */
    .chart-card { margin-top: 14px; padding: 16px 16px 8px; border: 1px solid var(--line); border-radius: var(--r-md); }
    .chart-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
    .chart-head h4 { font-size: 0.95rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--soft); font-size: 0.8rem; }
    .legend i { display: inline-block; width: 14px; height: 3px; margin-right: 6px; border-radius: 2px; vertical-align: 3px; }
    .legend i.dashed { height: 0; border-top: 2px dashed currentColor; background: none !important; }
    .chart { position: relative; margin-top: 8px; touch-action: pan-y; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .grid { stroke: var(--grid); stroke-dasharray: 3 5; }
    .chart .axis { fill: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    .chart .cross { stroke: var(--faint); stroke-width: 1; opacity: 0; }
    .chart.is-hover .cross { opacity: 0.6; }
    .tip {
      position: absolute;
      top: 4px;
      z-index: 2;
      min-width: 160px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.14);
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    .chart.is-hover .tip { opacity: 1; }
    .tip b { display: block; margin-bottom: 4px; }
    .tip div { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
    .tip div span { color: var(--soft); }
    .empty { padding: 26px 12px; color: var(--faint); text-align: center; }

    /* All values */
    .search {
      width: 100%;
      margin-top: 14px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--card-muted);
    }
    .search:focus, .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .groups { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; align-items: start; }
    .group { padding: 4px 16px 6px; border: 1px solid var(--line); border-radius: var(--r-md); }
    .group h4 { margin: 12px 0 2px; color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

    .foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 10px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 0.74rem;
      font-weight: 650;
    }

    /* Sign in */
    .login { width: min(420px, calc(100% - 32px)); margin: 8vh auto 0; }
    .login .shell { width: 100%; padding: 28px; }
    .login .logo { width: 200px; margin-bottom: 22px; }
    .field { display: block; margin-top: 14px; }
    .field span { display: block; margin-bottom: 6px; color: var(--soft); font-size: 0.85rem; font-weight: 600; }
    .field input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--card);
    }
    .error { min-height: 1.4em; margin-top: 12px; color: var(--danger); font-size: 0.9rem; }
    .primary {
      width: 100%;
      min-height: 44px;
      margin-top: 6px;
      border: 0;
      border-radius: var(--r-sm);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .primary:disabled { opacity: 0.6; cursor: default; }
    .note { margin-top: 16px; color: var(--faint); font-size: 0.82rem; text-align: center; }

    @media (max-width: 1100px) {
      .live-grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 980px) {
      .hp-body { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 900px) {
      .row, .flows, .groups { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 640px) {
      body { padding: 8px 0 24px; }
      .shell { width: calc(100% - 16px); padding: 16px; }
      .panel { padding: 16px; }
      .stats.three, .stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .unit .stats, .board-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .units { grid-template-columns: minmax(0, 1fr); }
      .board { padding: 8px; border-radius: 16px; }
      .details { columns: 1; }
      /* On a phone the scheme keeps its main readings, in larger type; the
         list below carries the rest. */
      .sx-cap:not(.keep), .sx-detail { display: none; }
      .sx-val { font-size: 25px; }
      .sx-val.small { font-size: 21px; }
      .sx-val.big { font-size: 30px; }
      .sx-cap.keep { font-size: 15px; }
      .sx-title { font-size: 22px; }
      .board-stat { padding: 10px 12px; }
      .board-stat span { font-size: 0.64rem; letter-spacing: 0.05em; }
      .history-bar { flex-direction: column; align-items: stretch; }
      .seg button { flex: 1; min-width: 0; }
      .pager { justify-content: space-between; }
      .pager strong { min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin, .sx-flow, .live::before { animation: none !important; }
    }

</head>

    const lang = (navigator.language || '').toLowerCase().startsWith('nl') ? 'nl' : 'en';
    const T = I18N[lang];
    const locale = lang === 'nl' ? 'nl-NL' : 'en-GB';
    document.documentElement.lang = lang;

    // --- Helpers ------------------------------------------------------------

    const $ = id => document.getElementById(id);
    const num = v => (typeof v === 'number' && Number.isFinite(v) ? v : null);
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    // Everything that comes from the controller is text, never markup.
    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    function icon(name, label = '') {
      const a11y = label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"';
      return `<svg class="icon" viewBox="0 0 24 24" ${a11y}>${ICONS[name]}</svg>`;
    }

    function nf(value, decimals = 0) {
      const n = num(value);
      if (n === null) return null;
      return n.toLocaleString(locale, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    // Plain text, "12,3 °C", or a dash.
    function qty(value, unit, decimals = 0) {
      const text = nf(value, decimals);
      return text === null ? '—' : `${text}${unit ? ` ${unit}` : ''}`;
    }

    // Markup with the unit set apart; only numbers and fixed units go in.
    function qtyHtml(value, unit, decimals = 0) {
      const text = nf(value, decimals);
      return text === null ? '—' : `${text}${unit ? `<span class="u">${unit}</span>` : ''}`;
    }

    // Compact temperatures for the scheme, where space is tight.
    function deg(value) {
      const text = nf(value, 1);
      return text === null ? '—' : `${text}°`;
    }

    function clock(date, seconds = true) {
      return date.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit', ...(seconds ? { second: '2-digit' } : {}) });
    }

    function onOff(value) {
      if (value === null || value === undefined) return '—';
      return value ? T.on : T.off;
    }

    // --- Session ------------------------------------------------------------

    const storage = {
      get(key) {
        try {
          return JSON.parse(localStorage.getItem(key));
        } catch (err) {
          return null;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (err) { /* private mode: this tab only */ }
      },
    };

    let session = storage.get(STORE_KEY) || {};
    // A link to another Homey than the remembered one starts afresh.
    const linkedId = location.hash.slice(1).trim().toLowerCase();
    if (HOMEY_ID.test(linkedId) && linkedId !== session.homeyId) session = { homeyId: linkedId };

    class HttpError extends Error {
      constructor(status) {
        super(`HTTP ${status}`);
        this.status = status;
      }
    }

    async function call(path, body) {
      const url = `https://${session.homeyId}.connect.athom.com/api/app/${APP_ID}${path}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        cache: 'no-store',
        credentials: 'omit',
      });
      if (!res.ok) throw new HttpError(res.status);
      return res.json();
    }

    // --- State --------------------------------------------------------------

    const app = {
      view: storage.get(TAB_KEY) || 'overview',
      snapshot: null,
      entities: new Map(),
      lastOk: null,
      failing: false,
      timer: null,
      polling: false,
      again: false,
      viewState: {},
    };

    // Values by entity id, as the firmware reports them.
    const ent = id => app.entities.get(id);
    const ev = id => {
      const entity = ent(id);
      return entity ? num(entity.value) : null;
    };
    const et = id => {
      const entity = ent(id);
      if (!entity || typeof entity.state !== 'string' || entity.state === 'NA') return null;
      return entity.state;
    };
    const eb = id => {
      const entity = ent(id);
      return entity && typeof entity.value === 'boolean' ? entity.value : null;
    };
    const cap = id => {
      const caps = app.snapshot && app.snapshot.capabilities;
      return caps && id in caps ? caps[id] : null;
    };
    const tele = key => (app.snapshot && app.snapshot.telemetry ? app.snapshot.telemetry[key] : undefined);
    const unitData = unit => (app.snapshot && app.snapshot.heatpumps ? app.snapshot.heatpumps[unit] : null);

    // Per-unit entities share a suffix under their own "HPx - " prefix.
    const UNIT_ENTITIES = {
      demand: 'sensor|compressor_frequency_demand',
      fanMax: 'sensor|fan_speed_max',
      eev: 'sensor|eev_steps',
      coil: 'sensor|evaporator_coil_temperature',

      crankcase: 'binary_sensor|crankcase_heater',
      plate: 'binary_sensor|bottom_plate_heater',
      oilReturn: 'binary_sensor|protection_-_compressor_oil_return',
    };
    const unitId = (unit, key) => {
      const [domain, suffix] = UNIT_ENTITIES[key].split('|');
      return `${domain}-${unit}_-_${suffix}`;
    };
    const levelId = unit => `sensor-${unit}_compressor_level`;

    const ID = {
      version: 'text_sensor-openquatt_version',
      cycling: 'binary_sensor-compressor_cycling_warning',
      silent: 'binary_sensor-silent_active',
      silentMode: 'select-silent_mode_override',

    const ENERGY_IDS = {
      now: {
        elec: 'sensor-heating_power_input',

    const CORE_IDS = [ID.version, ID.cycling, ID.silent, ID.boiler];

    // System and unit modes, as in the widgets.
    const MODES = {
      CM0: { key: 'standby', cls: '' },
      CM1: { key: 'circulate', cls: '' },
      CM2: { key: 'heating', cls: 'heat' },
      CM3: { key: 'heating', cls: 'heat' },

      CM98: { key: 'antifreeze', cls: 'frost' },

    };
    const UNIT_MODES = {
      Standby: { key: 'standby', cls: '' },
      Heating: { key: 'heating', cls: 'heat' },
      Cooling: { key: 'cooling', cls: 'cool' },
      Defrost: { key: 'defrost', cls: 'frost' },
    };

    // Protective routines the firmware lists among the failures without them
    // being a fault; the web app and the widgets do not warn about them either.
    const NOT_A_FAULT = ['compressor oil return'];

    function unitFaults(list) {
      if (typeof list !== 'string' || list === 'None') return [];
      return list.split(',').map(item => item.trim())
        .filter(item => item && !NOT_A_FAULT.includes(item.toLowerCase()));
    }

    function unitMode(hp) {
      const defrosting = hp.defrost === true || hp.mode === 'Defrost';
      return { defrosting, mode: UNIT_MODES[defrosting ? 'Defrost' : hp.mode] || null };
    }

    function units() {
      return ['hp1', 'hp2'].filter(unit => unitData(unit));
    }

    function problems() {
      const list = [];
      if (tele('lowflowFault')) list.push(T.lowflow);
      if (tele('flowMismatch')) list.push(T.flowMismatch);
      if (tele('otLinkProblem')) list.push(T.otLink);
      if (eb(ID.cycling)) list.push(T.cycling);
      for (const unit of ['hp1', 'hp2']) {
        const hp = unitData(unit);
        for (const fault of unitFaults(hp && hp.failures)) list.push(`${unit.toUpperCase()}: ${fault}`);
      }
      return list;
    }

    // --- Binding: build the markup once, then patch values in place, so
    // running animations (fans, flowing lines) do not restart on every poll.

    let bound = new Map();

    function bind(root) {
      bound = new Map();
      for (const el of root.querySelectorAll('[data-b]')) {
        const key = el.dataset.b;
        if (!bound.has(key)) bound.set(key, []);
        bound.get(key).push(el);
      }
    }

    function setText(key, text) {
      for (const el of bound.get(key) || []) if (el.textContent !== text) el.textContent = text;
    }

    function setHtml(key, html) {
      for (const el of bound.get(key) || []) if (el.innerHTML !== html) el.innerHTML = html;
    }

    function setClass(key, cls, on) {
      for (const el of bound.get(key) || []) el.classList.toggle(cls, Boolean(on));
    }

    function setStyle(key, prop, value) {
      for (const el of bound.get(key) || []) if (el.style.getPropertyValue(prop) !== value) el.style.setProperty(prop, value);
    }

    function setPill(key, label, cls) {
      for (const el of bound.get(key) || []) {
        el.textContent = label;
        el.className = `pill${cls ? ` ${cls}` : ''}`;
      }
    }

    function patch(el, html) {
      if (el && el.innerHTML !== html) el.innerHTML = html;
    }

    function stat(key, label, tone, extra = '') {
      return `<div class="stat ${tone} ${extra}">
        <p class="stat-label" data-b="${key}.label">${esc(label)}</p>
        <p class="stat-value" data-b="${key}">—</p>
        <p class="stat-note" data-b="${key}.note"></p>
      </div>`;
    }

    function row(name, value, cls = '') {
      return `<div class="list-row"><span>${esc(name)}</span><strong class="${cls}">${esc(value)}</strong></div>`;
    }

    // --- Drawings ------------------------------------------------------------

    // A generic outdoor unit: grille slats over a fan and an OpenQuatt-orange
    // accent. The fan turns at the unit's own speed.
    function outdoorUnit(unit) {
      const slats = [];
      for (let y = 22; y <= 134; y += 7) slats.push(`<line class="ou-slat" x1="16" x2="224" y1="${y}" y2="${y}"/>`);
      const blades = [0, 72, 144, 216, 288]
        .map(angle => `<path class="ou-blade" transform="rotate(${angle})" d="M0 -6 C 14 -14 34 -16 46 -8 C 38 -2 20 4 0 6 Z"/>`)
        .join('');
      return `<svg viewBox="0 0 240 172" aria-hidden="true">
        <defs>
          <linearGradient id="ou-body-${unit}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#363e4b"/>
            <stop offset="1" stop-color="#1a1f27"/>
          </linearGradient>
          <radialGradient id="ou-hole-${unit}">
            <stop offset="0.55" stop-color="#0d1117"/>
            <stop offset="1" stop-color="#1b2028"/>
          </radialGradient>
        </defs>
        <ellipse cx="120" cy="163" rx="104" ry="7" fill="rgba(15,23,42,0.18)"/>
        <rect x="34" y="146" width="26" height="12" rx="3" fill="#232832"/>
        <rect x="180" y="146" width="26" height="12" rx="3" fill="#232832"/>
        <rect x="8" y="10" width="224" height="140" rx="14" fill="url(#ou-body-${unit})" stroke="rgba(255,255,255,0.07)"/>
        <circle cx="92" cy="80" r="56" fill="url(#ou-hole-${unit})"/>
        <g transform="translate(92 80)">
          <g class="spin">${blades}</g>
          <circle r="9" fill="#2a313c" stroke="rgba(255,255,255,0.16)"/>
        </g>
        ${slats.join('')}
        <circle cx="92" cy="80" r="56" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
        <rect x="160" y="118" width="58" height="9" rx="4.5" fill="#ea580c" opacity="0.92"/>
        <circle class="ou-led" cx="210" cy="26" r="4"/>
        <g class="ou-snow" transform="translate(92 80)" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M0 -22V22M-19 -11 19 11M-19 11 19 -11"/>

    // --- Charts ----------------------------------------------------------------

    function niceScale(min, max, ticks = 4, includeZero = false) {
      let lo = includeZero ? Math.min(0, min) : min;
      let hi = max;
      if (lo === hi) { lo -= 1; hi += 1; }
      const raw = (hi - lo) / ticks;
      const power = 10 ** Math.floor(Math.log10(raw));
      const unit = raw / power;
      const step = (unit <= 1 ? 1 : unit <= 2 ? 2 : unit <= 5 ? 5 : 10) * power;
      lo = Math.floor(lo / step) * step;
      hi = Math.ceil(hi / step) * step;
      const values = [];
      for (let v = lo; v <= hi + step / 2; v += step) values.push(Math.round(v * 1000) / 1000);
      return { lo, hi, values, step };
    }

    function gridLines(scale, y, width, pad) {
      const decimals = scale.step < 1 ? 1 : 0;
      return scale.values.map(v => `<line class="grid" x1="${pad.l}" x2="${width - pad.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`
        + `<text class="axis" x="${pad.l - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${esc(nf(v, decimals))}</text>`).join('');
    }

    function placeTip(tip, anchor, boxWidth) {
      const right = anchor + 12;
      tip.style.left = `${right + tip.offsetWidth > boxWidth ? Math.max(0, anchor - tip.offsetWidth - 12) : right}px`;
    }

    // Lines over time, broken where values are missing, with a crosshair and
    // a tooltip. Series: { label, color, values, dashed, area }.
    function lineChart(container, {
      times, series, start, end, height = 210, unit = '', decimals = 0, zero = false,
    }) {
      const width = Math.max(280, container.clientWidth || 600);
      const pad = { l: 44, r: 12, t: 10, b: 24 };
      const all = series.flatMap(s => s.values).filter(v => num(v) !== null);
      if (!all.length) {
        container.innerHTML = `<p class="empty">${esc(T.trendsBuilding)}</p>`;
        return;
      }
      const scale = niceScale(Math.min(...all), Math.max(...all), 4, zero);
      const x = t => pad.l + ((t - start) / (end - start)) * (width - pad.l - pad.r);
      const y = v => pad.t + (1 - (v - scale.lo) / (scale.hi - scale.lo)) * (height - pad.t - pad.b);
      const gapMs = ((times[1] - times[0]) || 300000) * 1.6;
      const base = y(Math.max(scale.lo, 0));

      const paths = series.map(s => {
        let line = '';
        let area = '';
        let run = [];
        const flush = () => {
          if (!run.length) return;
          const points = run.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)} ${py.toFixed(1)}`).join('');
          line += points;
          if (s.area) area += `${points}L${run[run.length - 1][0].toFixed(1)} ${base.toFixed(1)}L${run[0][0].toFixed(1)} ${base.toFixed(1)}Z`;
          run = [];
        };
        s.values.forEach((v, i) => {
          if (num(v) === null || (i && times[i] - times[i - 1] > gapMs)) flush();
          if (num(v) !== null) run.push([x(times[i]), y(v)]);
        });
        flush();
        return `${area ? `<path d="${area}" fill="${s.color}" opacity="0.12"/>` : ''}`
          + `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dashed ? ' stroke-dasharray="5 5"' : ''}/>`;
      }).join('');

      const labels = [];
      const stepHours = width < 520 ? 6 : 3;
      const first = new Date(start);
      first.setMinutes(0, 0, 0);
      for (let t = first.getTime() + 3600000; t <= end; t += 3600000) {
        const hour = new Date(t).getHours();
        if (hour % stepHours === 0) labels.push(`<text class="axis" x="${x(t).toFixed(1)}" y="${height - 6}" text-anchor="middle">${String(hour).padStart(2, '0')}:00</text>`);
      }

      container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img">${gridLines(scale, y, width, pad)}${labels.join('')}${paths}`
        + `<line class="cross" x1="0" x2="0" y1="${pad.t}" y2="${height - pad.b}"/><g class="dots"></g>`
        + `<rect x="${pad.l}" y="0" width="${width - pad.l - pad.r}" height="${height}" fill="transparent"/></svg><div class="tip"></div>`;

      const svg = container.querySelector('svg');
      const cross = container.querySelector('.cross');
      const dots = container.querySelector('.dots');
      const tip = container.querySelector('.tip');
      const show = event => {
        const box = svg.getBoundingClientRect();
        const t = start + ((((event.clientX - box.left) / box.width) * width - pad.l) / (width - pad.l - pad.r)) * (end - start);
        let index = 0;
        times.forEach((time, i) => { if (Math.abs(time - t) < Math.abs(times[index] - t)) index = i; });
        const cx = x(times[index]);
        cross.setAttribute('x1', cx);
        cross.setAttribute('x2', cx);
        dots.innerHTML = series.map(s => (num(s.values[index]) === null ? ''
          : `<circle cx="${cx}" cy="${y(s.values[index])}" r="3.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`)).join('');
        tip.innerHTML = `<b>${esc(clock(new Date(times[index]), false))}</b>${series.map(s => `<div><span><i class="dot" style="background:${s.color}"></i>${esc(s.label)}</span><strong>${esc(qty(s.values[index], unit, decimals))}</strong></div>`).join('')}`;
        placeTip(tip, (cx / width) * box.width, box.width);
        container.classList.add('is-hover');
      };
      svg.addEventListener('pointermove', show);
      svg.addEventListener('pointerdown', show);
      svg.addEventListener('pointerleave', () => container.classList.remove('is-hover'));
    }

    // Bars per hour or day: heat output stacked with cooling and boiler heat,
    // and in front the electricity it took, so the difference is what came
    // from the outside air.
    function barChart(container, { items, height = 220 }) {
      const width = Math.max(280, container.clientWidth || 600);
      const pad = { l: 40, r: 8, t: 12, b: 24 };
      const kwh = wh => (num(wh) === null ? 0 : wh / 1000);
      const max = Math.max(0.5, ...items.map(item => Math.max(kwh(item.heat) + kwh(item.cooling) + kwh(item.boiler), kwh(item.electrical))));
      const scale = niceScale(0, max, 4, true);
      const slot = (width - pad.l - pad.r) / items.length;
      const barW = clamp(slot * 0.64, 3, 34);
      const y = v => pad.t + (1 - v / scale.hi) * (height - pad.t - pad.b);
      const h = v => (v / scale.hi) * (height - pad.t - pad.b);
      const every = items.length > 24 ? Math.ceil(items.length / 10) : items.length > 12 ? 3 : 1;
      const bars = items.map((item, i) => {
        const cx = pad.l + slot * (i + 0.5);
        const left = (cx - barW / 2).toFixed(1);
        let top = y(0);
        const stack = [[kwh(item.heat), 'var(--emerald)'], [kwh(item.cooling), 'var(--blue)'], [kwh(item.boiler), 'var(--slate)']]
          .filter(([v]) => v > 0)
          .map(([v, color]) => {
            top -= h(v);
            return `<rect x="${left}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${h(v).toFixed(1)}" rx="2" fill="${color}"/>`;
          }).join('');
        const e = kwh(item.electrical);
        const elec = e > 0 ? `<rect x="${left}" y="${y(e).toFixed(1)}" width="${barW.toFixed(1)}" height="${h(e).toFixed(1)}" rx="2" fill="var(--amber)"/>` : '';
        const label = i % every === 0 ? `<text class="axis" x="${cx.toFixed(1)}" y="${height - 6}" text-anchor="middle">${esc(item.short)}</text>` : '';
        return `${stack}${elec}${label}`;
      }).join('');
      container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img">${gridLines(scale, y, width, pad)}${bars}`
        + `<rect class="hl" x="0" y="${pad.t}" width="0" height="${height - pad.t - pad.b}" fill="var(--accent)" opacity="0.08"/>`
        + `<rect x="${pad.l}" y="0" width="${width - pad.l - pad.r}" height="${height}" fill="transparent"/></svg><div class="tip"></div>`;

      const svg = container.querySelector('svg');
      const hl = container.querySelector('.hl');
      const tip = container.querySelector('.tip');
      const show = event => {
        const box = svg.getBoundingClientRect();
        const index = clamp(Math.floor((((event.clientX - box.left) / box.width) * width - pad.l) / slot), 0, items.length - 1);
        const item = items[index];
        hl.setAttribute('x', pad.l + slot * index);
        hl.setAttribute('width', slot);
        const line = (color, label, value) => `<div><span><i class="dot" style="background:${color}"></i>${esc(label)}</span><strong>${esc(qty(kwh(value), 'kWh', 2))}</strong></div>`;
        const cop = num(item.heatingInput) > 0 && num(item.heat) !== null ? item.heat / item.heatingInput : null;
        tip.innerHTML = `<b>${esc(item.title)}</b>${line('var(--emerald)', T.legendHeat, item.heat)}`
          + `${num(item.cooling) ? line('var(--blue)', T.legendCool, item.cooling) : ''}`
          + `${num(item.boiler) ? line('var(--slate)', T.legendBoiler, item.boiler) : ''}`
          + `${line('var(--amber)', T.legendElectric, item.electrical)}`
          + `${cop !== null ? `<div><span>${esc(T.cop)}</span><strong>${esc(nf(cop, 1))}</strong></div>` : ''}`;
        placeTip(tip, ((pad.l + slot * (index + 0.5)) / width) * box.width, box.width);
        container.classList.add('is-hover');
      };
      svg.addEventListener('pointermove', show);
      svg.addEventListener('pointerdown', show);
      svg.addEventListener('pointerleave', () => container.classList.remove('is-hover'));
    }

    // --- Views ---------------------------------------------------------------

    const VIEWS = {};

    VIEWS.overview = {
      entities: () => [...CORE_IDS, ID.strategy, ID.targetSource, ID.capacity, ID.silentMode, ID.heatingSource],
      build() {
        const unitCards = ['hp1', 'hp2'].map(unit => `
          <article class="panel unit" data-b="${unit}.card" hidden>
            <div class="unit-head">
              <h3>${unit.toUpperCase()}</h3>

            </div>
            <div class="unit-art" data-b="${unit}.art">

              <div class="unit-water">
                <span class="hot">${esc(T.supply)} <b data-b="${unit}.waterOut">—</b></span>
                <span class="cold">${esc(T.return)} <b data-b="${unit}.waterIn">—</b></span>
                <span>${esc(T.flow)} <b data-b="${unit}.flow">—</b></span>

            </div>
            <div class="stats">
              ${stat(`${unit}.freq`, T.compressor, '')}
              ${stat(`${unit}.fan`, T.fan, '')}

              ${stat(`${unit}.eff`, T.cop, 'green')}
            </div>
            <p class="unit-foot" data-b="${unit}.foot"></p>
          </article>`).join('');

        return `<div class="stack">
          <section class="panel">
            <p class="kicker">${esc(T.overviewKicker)}</p>
            <h2>${esc(T.overviewTitle)}</h2>
            <p class="panel-lead">${esc(T.overviewLead)}</p>
            <div class="live-grid">
              <div>
                <h3 class="sub">${esc(T.keyFigures)}</h3>
                <div class="stats">
                  ${stat('elec', T.electrical, 'blue')}
                  ${stat('out', T.heatOutput, 'orange')}
                  ${stat('eff', T.cop, 'green')}
                  ${stat('flow', T.flow, 'sky')}
                </div>
                <h3 class="sub">${esc(T.systemStatus)}</h3>
                <div class="stats">
                  ${stat('strategy', T.strategy, 'orange', 'is-text')}
                  ${stat('mode', T.controlMode, 'orange', 'is-text')}
                  ${stat('regulation', T.regulation, 'orange', 'is-text')}
                  ${stat('system', T.system, 'orange', 'is-text')}
