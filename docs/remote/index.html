              </div>
              <div>
                <h3 class="sub">${esc(T.status)}</h3>
                <div class="controls" id="controls"></div>
              </div>
            </div>
          </section>
          <div class="row">
            <section class="panel">
              <h3>${esc(T.curveTitle)}</h3>
              <p class="panel-lead">${esc(T.curveLead)}</p>
              <div class="target">
                <p class="stat-label">${esc(T.target)}</p>
                <p class="target-value" data-b="target">—</p>
                <p class="stat-note" data-b="target.note"></p>
                <div class="gauge" data-b="gauge"></div>
                <div class="gauge-scale" data-b="gauge.scale"></div>
              </div>
              <div class="stats three">
                ${stat('supply', T.measuredSupply, 'orange', 'accented')}
                ${stat('deviation', T.deviation, 'blue', 'accented')}
                ${stat('capacity', T.capacity, 'sky', 'accented')}
              </div>
            </section>
            <section class="panel">
              <h3>${esc(T.temperatures)}</h3>
              <p class="panel-lead">${esc(T.temperaturesLead)}</p>
              <div class="list" id="temps" style="margin-top:8px"></div>
            </section>
          </div>
        </div>
        <div class="units-head">
          <div>
            <h3>${esc(T.heatpumps)}</h3>
            <p data-b="units.summary"></p>
          </div>
          <button class="ghost-btn" type="button" data-go="heatpumps">${esc(T.showScheme)} ${icon('arrow')}</button>
        </div>
        <div class="units">${unitCards}</div>`;
      },
      update() {
        const code = tele('controlModeCode');
        const cooling = code === 'CM5';
        const supply = num(cap('measure_temperature.supply'));
        const target = num(cap('measure_temperature.supply_target'));
        const ret = num(cap('measure_temperature.return'));

        setHtml('elec', qtyHtml(cap('measure_power'), 'W'));
        setText('elec.note', T.electricalNote);
        setText('out.label', cooling ? T.coolOutput : T.heatOutput);
        setHtml('out', qtyHtml(cooling ? cap('oq_cool_power') : cap('oq_heat_power'), 'W'));
        setText('out.note', T.thermalNote);
        setText('eff.label', cooling ? T.eer : T.cop);
        setHtml('eff', qtyHtml(cooling ? cap('oq_eer') : cap('oq_cop'), '', 1));
        setText('eff.note', T.efficiencyNote);
        setHtml('flow', qtyHtml(cap('oq_flow'), 'L/h'));
        setText('flow.note', T.flowNote);

        const strategy = et(ID.strategy);
        let strategyText = strategy || '—';
        if (strategy && /heating curve/i.test(strategy)) strategyText = T.strategyCurve;
        else if (strategy && /power/i.test(strategy)) strategyText = T.strategyPower;
        setText('strategy', strategyText);
        setText('strategy.note', T.strategyNote);
        setText('mode', cap('oq_control_mode') || '—');
        setText('mode.note', T.controlModeNote);

        let regulation = '—';
        if (code && MODES[code] && !MODES[code].cls) regulation = T.noDemand;
        else if (supply !== null && target !== null && !cooling) {
          const diff = supply - target;
          regulation = diff < -1.5 ? T.belowTarget : diff > 1.5 ? T.aboveTarget : T.onTarget;
        }
        setText('regulation', regulation);
        setText('regulation.note', T.regulationNote);

        const list = problems();
        let system = T.normal;
        if (list.length) system = T.faultCount(list.length);
        else if (units().some(unit => unitMode(unitData(unit)).defrosting)) system = T.defrost;
        else if (eb(ID.boiler)) system = T.boilerActive;
        else if (eb(ID.silent)) system = T.silentActive;
        setText('system', system);
        setText('system.note', T.systemNote);

        const silentSetting = et(ID.silentMode);
        const heatingSource = et(ID.heatingSource);
        const coolingBlock = tele('coolingBlockReason');
        const cards = [
          [T.openquatt, cap('onoff.openquatt'), cap('onoff.openquatt') === false ? T.openquattOff : T.openquattOn, T.active],
          [T.heatingPermission, cap('oq_heating_permitted'), heatingSource ? T.source(heatingSource) : ''],
          [T.coolingPermission, cap('oq_cooling_permitted'), coolingBlock && coolingBlock !== 'None' ? coolingBlock : ''],
          [T.silentMode, eb(ID.silent), silentSetting ? T.setting(silentSetting) : ''],
          [T.auxRelay, cap('onoff.aux_relay'), cap('oq_aux_status') || ''],
        ];
        patch($('controls'), cards.map(([name, value, note, onLabel]) => `
          <div class="control ${value ? 'is-on' : ''}">
            <div class="control-head">
              <span class="control-name">${esc(name)}</span>
              <span class="pill ${value ? 'on' : ''}">${esc(value === null || value === undefined ? '—' : value ? (onLabel || T.on) : T.off)}</span>
            </div>
            ${note ? `<p class="control-note">${esc(note)}</p>` : ''}
          </div>`).join(''));

        setHtml('target', qtyHtml(target, '°C', target !== null && target % 1 ? 1 : 0));
        const source = et(ID.targetSource);
        setText('target.note', source ? T.targetSource(source === 'curve' ? T.targetSourceCurve : T.targetSourceExternal) : '');
        const marks = [[ret, 'is-return'], [supply, 'is-supply'], [target, 'is-target']].filter(([v]) => v !== null);
        if (marks.length) {
          const lo = Math.floor(Math.min(...marks.map(([v]) => v)) / 5) * 5 - 5;
          const hi = Math.ceil(Math.max(...marks.map(([v]) => v)) / 5) * 5 + 5;
          setHtml('gauge', marks.map(([v, cls]) => `<i class="${cls}" style="left:${(((v - lo) / (hi - lo)) * 100).toFixed(1)}%"></i>`).join(''));
          setHtml('gauge.scale', `<span>${lo}°</span><span>`
            + `<span><i class="dot" style="background:var(--blue)"></i>${esc(T.gaugeReturn)}</span>`
            + `<span><i class="dot" style="background:var(--orange)"></i>${esc(T.gaugeSupply)}</span>`
            + `<span><i class="dot" style="background:var(--ink)"></i>${esc(T.gaugeTarget)}</span>`
            + `</span><span>${hi}°</span>`);
        }
        setHtml('supply', qtyHtml(supply, '°C', 1));
        setText('supply.note', T.measuredSupplyNote);
        const deviation = supply !== null && target !== null ? supply - target : null;
        setHtml('deviation', deviation === null ? '—' : `${deviation > 0.05 ? '+' : deviation < -0.05 ? '−' : ''}${nf(Math.abs(deviation), 1)}<span class="u">°C</span>`);
        setText('deviation.note', T.deviationNote);
        setHtml('capacity', qtyHtml(ev(ID.capacity), 'W'));
        setText('capacity.note', T.capacityNote);

        const temps = [
          [T.room, cap('measure_temperature.room')],
          [T.roomSetpoint, cap('measure_temperature.setpoint')],
          [T.supply, supply],
          [T.return, ret],
          [T.outside, cap('measure_temperature.outside')],
        ];
        if (num(cap('measure_temperature.dew_point')) !== null) temps.push([T.dewPoint, cap('measure_temperature.dew_point')]);
        patch($('temps'), temps.map(([name, value]) => row(name, qty(value, '°C', 1))).join(''));

        const summary = [];
        for (const unit of ['hp1', 'hp2']) {
          const hp = unitData(unit);
          for (const el of bound.get(`${unit}.card`) || []) el.hidden = !hp;
          if (!hp) continue;
          const { defrosting, mode } = unitMode(hp);
          const coolingUnit = hp.mode === 'Cooling' && !defrosting;
          const label = mode ? T[mode.key] : (hp.mode || T.unknown);
          summary.push(T.unitSays(unit.toUpperCase(), label));
          if (app.snapshot.available === false) setPill(`${unit}.badge`, T.offline, 'off');
          else setPill(`${unit}.badge`, label, mode ? mode.cls : '');
          setClass(`${unit}.card`, 'is-heat', mode && mode.cls === 'heat');
          setClass(`${unit}.card`, 'is-cool', mode && mode.cls === 'cool');
          setClass(`${unit}.card`, 'is-frost', defrosting);
          const fan = num(hp.fanSpeed);
          setClass(`${unit}.art`, 'is-spinning', fan > 0);
          if (fan) setStyle(`${unit}.art`, '--spin', `${clamp(700 / fan, 0.35, 4).toFixed(1)}s`);
          setText(`${unit}.waterOut`, qty(hp.waterOut, '°C', 1));
          setText(`${unit}.waterIn`, qty(hp.waterIn, '°C', 1));
          setText(`${unit}.flow`, qty(hp.flow, 'L/h'));
          setHtml(`${unit}.freq`, qtyHtml(hp.frequency, 'Hz'));
          setHtml(`${unit}.fan`, qtyHtml(fan, 'rpm'));
          setHtml(`${unit}.power`, qtyHtml(hp.power, 'W'));
          setText(`${unit}.eff.label`, coolingUnit ? T.eer : T.cop);
          setHtml(`${unit}.eff`, qtyHtml(coolingUnit ? hp.eer : hp.cop, '', 1));
          const faults = unitFaults(hp.failures);
          setText(`${unit}.foot`, faults.length ? faults.join(', ') : T.noFaults);
          setClass(`${unit}.foot`, 'is-problem', faults.length);
        }
        setText('units.summary', summary.length ? summary.join(', ') : T.noUnits);
      },
    };

    VIEWS.heatpumps = {
      entities: () => [...CORE_IDS, ...['hp1', 'hp2'].flatMap(unit => [...Object.keys(UNIT_ENTITIES).map(key => unitId(unit, key)), levelId(unit)])],
      build() {
        const list = units();
        app.viewState.heatpumpUnits = list.join();
        const intro = `<section class="panel">
          <p class="kicker">${esc(T.hpKicker)}</p>
          <h2>${esc(T.hpTitle)}</h2>
          <p class="panel-lead">${esc(T.hpLead)}</p>
          ${list.length ? '' : `<p class="empty">${esc(T.noUnits)}</p>`}
        </section>`;
        return `<div class="stack">${intro}${list.map(unit => `
          <section class="panel">
            <div class="unit-head hp-head">
              <h3>${unit.toUpperCase()}</h3>
              <span class="pill" data-b="${unit}.badge">—</span>
              <span class="muted" data-b="${unit}.runtime"></span>
            </div>
            <div class="hp-body">
            <div class="board" data-b="${unit}.board">
              ${schematic(unit)}
              <div class="board-stats">
                <div class="board-stat"><span>${esc(T.workingMode)}</span><strong data-b="${unit}.mode">—</strong></div>
                <div class="board-stat"><span>${esc(T.powerUse)}</span><strong data-b="${unit}.power">—</strong></div>
                <div class="board-stat"><span data-b="${unit}.outLabel">${esc(T.heatUse)}</span><strong data-b="${unit}.out">—</strong></div>
                <div class="board-stat"><span data-b="${unit}.effLabel">${esc(T.cop)}</span><strong data-b="${unit}.eff">—</strong></div>
              </div>
            </div>
            <div class="details" data-b="${unit}.details"></div>
            </div>
          </section>`).join('')}</div>`;
      },
      update() {
        if (units().join() !== app.viewState.heatpumpUnits) {
          renderView();
          return;
        }
        for (const unit of units()) {
          const hp = unitData(unit);
          const u = key => ev(unitId(unit, key));
          const { defrosting, mode } = unitMode(hp);
          const coolingUnit = hp.mode === 'Cooling' && !defrosting;
          const label = mode ? T[mode.key] : (hp.mode || T.unknown);
          if (app.snapshot.available === false) setPill(`${unit}.badge`, T.offline, 'off');
          else setPill(`${unit}.badge`, label, mode ? mode.cls : '');
          const runtime = u('runtime');
          setText(`${unit}.runtime`, runtime === null ? '' : T.runtime(nf(runtime, 1)));

          const freq = num(hp.frequency);
          const fan = num(hp.fanSpeed);
          const flow = num(hp.flow);
          setClass(`${unit}.board`, 'is-running', freq > 0);
          setClass(`${unit}.board`, 'is-flowing', flow > 0);
          setClass(`${unit}.board`, 'is-spinning', fan > 0);
          setClass(`${unit}.board`, 'is-defrost', defrosting);
          setClass(`${unit}.board`, 'is-off', !(freq > 0) && !defrosting);
          if (freq) setStyle(`${unit}.board`, '--speed', `${clamp(60 / freq, 0.5, 2.4).toFixed(1)}s`);
          if (flow) setStyle(`${unit}.board`, '--water-speed', `${clamp(900 / flow, 0.6, 3).toFixed(1)}s`);
          if (fan) setStyle(`${unit}.board`, '--spin', `${clamp(700 / fan, 0.35, 4).toFixed(1)}s`);

          setText(`${unit}.waterOut`, deg(hp.waterOut));
          setText(`${unit}.waterIn`, deg(hp.waterIn));
          setText(`${unit}.flow`, qty(flow, 'L/h'));
          setText(`${unit}.freq`, nf(freq, 0) ?? '—');
          const demand = u('demand');
          setText(`${unit}.demand`, demand === null ? '' : T.capDemand(qty(demand, 'Hz')));
          setText(`${unit}.discharge`, deg(u('discharge')));
          setText(`${unit}.pHigh`, u('pHigh') === null ? '' : qty(u('pHigh'), 'bar', 1));
          setText(`${unit}.suction`, deg(u('suction')));
          setText(`${unit}.pLow`, u('pLow') === null ? '' : qty(u('pLow'), 'bar', 1));
          setText(`${unit}.tCond`, deg(u('tCond')));
          setText(`${unit}.tEvap`, deg(u('tEvap')));
          setText(`${unit}.coil`, deg(u('coil')));
          setText(`${unit}.outside`, deg(hp.outside));
          setText(`${unit}.fan`, qty(fan, 'rpm'));
          const eev = u('eev');
          setText(`${unit}.eev`, eev === null ? '' : T.capEev(`${nf(eev)} ${T.steps}`));

          setText(`${unit}.mode`, label);
          setText(`${unit}.power`, qty(hp.power, 'W'));
          setText(`${unit}.outLabel`, coolingUnit ? T.coolUse : T.heatUse);
          setText(`${unit}.out`, qty(coolingUnit ? hp.coolPower : hp.heatPower, 'W'));
          setText(`${unit}.effLabel`, coolingUnit ? T.eer : T.cop);
          setText(`${unit}.eff`, qty(coolingUnit ? hp.eer : hp.cop, '', 1));

          const delta = num(hp.waterOut) !== null && num(hp.waterIn) !== null ? Math.abs(hp.waterOut - hp.waterIn) : null;
          const fanMax = u('fanMax');
          const faults = unitFaults(hp.failures);
          const group = (title, rows) => `<div><h4>${esc(title)}</h4><div class="list compact">${rows.join('')}</div></div>`;
          const flag = key => {
            const value = eb(unitId(unit, key));
            return [onOff(value), value ? 'on' : ''];
          };
          setHtml(`${unit}.details`, [
            group(T.dCompressor, [
              row(T.frequency, qty(freq, 'Hz')),
              row(T.demand, qty(demand, 'Hz')),
              row(T.level, nf(ev(levelId(unit))) ?? '—'),
              row(T.profile, et(unitId(unit, 'profile')) || '—'),
            ]),
            group(T.dRefrigerant, [
              row(T.highPressure, qty(u('pHigh'), 'bar', 1)),
              row(T.lowPressure, qty(u('pLow'), 'bar', 1)),
              row(T.discharge, qty(u('discharge'), '°C', 1)),
              row(T.suction, qty(u('suction'), '°C', 1)),
              row(T.condensing, qty(u('tCond'), '°C', 1)),
              row(T.evaporating, qty(u('tEvap'), '°C', 1)),
              row(T.innerCoil, qty(u('innerCoil'), '°C', 1)),
            ]),
            group(T.dUnit, [
              row(T.outside, qty(hp.outside, '°C', 1)),
              row(T.coil, qty(u('coil'), '°C', 1)),
              row(T.fanSpeed, fanMax ? `${qty(fan, 'rpm')} / ${qty(fanMax, 'rpm')}` : qty(fan, 'rpm')),
              row(T.eev, eev === null ? '—' : `${nf(eev)} ${T.steps}`),
            ]),
            group(T.dWater, [
              row(T.supply, qty(hp.waterOut, '°C', 1)),
              row(T.return, qty(hp.waterIn, '°C', 1)),
              row(T.deltaT, qty(delta, '°C', 1)),
              row(T.flow, qty(flow, 'L/h')),
              row(T.pump, qty(u('pump'), 'W', 1)),
            ]),
            group(T.dElectric, [
              row(T.powerIn, qty(hp.power, 'W')),
              row(T.voltage, qty(u('volt'), 'V')),
              row(T.current, qty(u('amp'), 'A', 2)),
            ]),
            group(T.dStatus, [
              row(T.runtimeLabel, qty(runtime, 'h', 1)),
              row(T.fourWay, ...flag('fourWay')),
              row(T.crankcase, ...flag('crankcase')),
              row(T.bottomPlate, ...flag('plate')),
              row(T.oilReturn, ...flag('oilReturn')),
              row(T.faults, faults.length ? faults.join(', ') : T.noFaults),
            ]),
          ].join(''));
        }
      },
    };

    // --- Energy ------------------------------------------------------------------

    const dateKey = date => date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
    const addDays = (date, days) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + days, 12);
    const weekStart = date => addDays(date, -((date.getDay() + 6) % 7));
    const isoWeek = date => {
      const thursday = addDays(weekStart(date), 3);
      const firstThursday = addDays(weekStart(new Date(thursday.getFullYear(), 0, 4, 12)), 3);
      return 1 + Math.round((thursday - firstThursday) / (7 * 86400000));
    };
    const dayMonth = date => date.toLocaleDateString(locale, { day: 'numeric', month: 'short' }).replace('.', '');
    const capitalize = text => text.charAt(0).toUpperCase() + text.slice(1);

    function period(mode, anchor) {
      if (mode === 'day') {
        return { from: anchor, to: anchor, hours: true, label: capitalize(anchor.toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long' })) };
      }
      if (mode === 'week') {
        const from = weekStart(anchor);
        const to = addDays(from, 6);
        return { from, to, hours: false, label: T.weekLabel(isoWeek(anchor), `${dayMonth(from)} – ${dayMonth(to)}`) };
      }
      const from = new Date(anchor.getFullYear(), anchor.getMonth(), 1, 12);
      const to = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0, 12);
      return { from, to, hours: false, label: capitalize(from.toLocaleDateString(locale, { month: 'long', year: 'numeric' })) };
    }

    function shift(mode, anchor, step) {
      if (mode === 'day') return addDays(anchor, step);
      if (mode === 'week') return addDays(anchor, 7 * step);
      return new Date(anchor.getFullYear(), anchor.getMonth() + step, 1, 12);
    }

    const results = {
      mode: 'day', anchor: addDays(new Date(), 0), data: null, error: null, loadedAt: 0, key: '',
    };

    async function loadEnergy(force = false) {
      const p = period(results.mode, results.anchor);
      const key = `${results.mode}:${dateKey(p.from)}`;
      if (!force && results.key === key && Date.now() - results.loadedAt < SLOW_POLL_MS) return;
      if (results.key !== key) results.data = null;
      results.key = key;
      results.loadedAt = Date.now();
      results.error = null;
      VIEWS.energy.renderHistory();
      try {
        // A running period is asked up to today: the rest has no data yet.
        const to = Math.min(dateKey(p.to), dateKey(new Date()));
        const result = await call('/remote/energy', {
          token: session.token, from: dateKey(p.from), to, hours: p.hours,
        });
        if (results.key !== key) return;
        if (result.error === 'unauthorized') { signedOut(); return; }
        results.data = result.energy || null;
        results.error = result.error ? 'unavailable' : null;
      } catch (err) {
        if (results.key !== key) return;
        results.error = err.status === 404 ? 'update' : 'unavailable';
      }
      VIEWS.energy.renderHistory();
    }

    VIEWS.energy = {
      entities: () => [...CORE_IDS, ...Object.values(ENERGY_IDS).flatMap(group => Object.values(group))],
      build() {
        const seg = ['day', 'week', 'month'].map(mode => `<button type="button" data-mode="${mode}" class="${results.mode === mode ? 'is-active' : ''}">${esc(T[mode])}</button>`).join('');
        return `<div class="stack">
          <section class="panel">
            <p class="kicker">${esc(T.energyKicker)}</p>
            <h2>${esc(T.energyTitle)}</h2>
            <p class="panel-lead">${esc(T.energyLead)}</p>
            <div class="flows" id="flows"></div>
          </section>
          <section class="panel">
            <p class="kicker">${esc(T.resultsKicker)}</p>
            <h2>${esc(T.resultsTitle)}</h2>
            <p class="panel-lead">${esc(T.resultsLead)}</p>
            <div class="history-bar">
              <div class="seg" id="seg">${seg}</div>
              <div class="pager">
                <button class="icon-btn" type="button" id="prev" aria-label="${esc(T.previous)}">${icon('prev')}</button>
                <strong id="period"></strong>
                <button class="icon-btn" type="button" id="next" aria-label="${esc(T.nextPeriod)}">${icon('next')}</button>
              </div>
            </div>
            <div id="history"></div>
          </section>
        </div>`;
      },
      mounted() {
        $('seg').addEventListener('click', event => {
          const button = event.target.closest('button[data-mode]');
          if (!button) return;
          results.mode = button.dataset.mode;
          results.anchor = addDays(new Date(), 0);
          for (const el of $('seg').children) el.classList.toggle('is-active', el === button);
          loadEnergy(true);
        });
        $('prev').addEventListener('click', () => {
          results.anchor = shift(results.mode, results.anchor, -1);
          loadEnergy(true);
        });
        $('next').addEventListener('click', () => {
          results.anchor = shift(results.mode, results.anchor, 1);
          loadEnergy(true);
        });
        this.renderHistory();
        loadEnergy();
      },
      update() {
        const value = (group, key, unit, decimals) => qty(ev(ENERGY_IDS[group][key]), unit, decimals);
        const column = (group, title, power) => {
          const u = power ? 'W' : 'kWh';
          const d = power ? 0 : 1;
          return `<div class="flow-col">
            <h4>${esc(title)}</h4>
            <div class="flow-box">
              <p>${esc(T.heatingBox)}</p>
              <h5>${esc(T.heatpump)}</h5>
              <div class="list">
                ${row(power ? T.electricalPower : T.electricity, value(group, 'elec', u, d))}
                ${row(T.heat, value(group, 'heat', u, d))}
                ${row(T.cop, value(group, 'cop', '', 1))}
              </div>
              <h5>${esc(T.boiler)}</h5>
              <div class="list">${row(T.heat, value(group, 'boiler', u, d))}</div>
              <h5>${esc(T.systemHeat)}</h5>
              <div class="list">${row(T.heat, value(group, 'system', u, d))}</div>
            </div>
            <div class="flow-box cool">
              <p>${esc(T.coolingBox)}</p>
              <h5>${esc(T.heatpump)}</h5>
              <div class="list">
                ${row(power ? T.electricalPower : T.electricity, value(group, 'coolElec', u, d))}
                ${row(T.coolingEnergy, value(group, 'cool', u, d))}
                ${row(T.eer, value(group, 'eer', '', 1))}
              </div>
            </div>
          </div>`;
        };
        patch($('flows'), column('now', T.now, true) + column('today', T.today, false) + column('total', T.cumulative, false));
        // A running period keeps up with the day.
        if (dateKey(period(results.mode, results.anchor).to) >= dateKey(new Date())) loadEnergy();
      },
      renderHistory() {
        const target = $('history');
        if (!target) return;
        const p = period(results.mode, results.anchor);
        const today = dateKey(new Date());
        $('period').textContent = p.label;
        $('next').disabled = dateKey(p.to) >= today;
        const bounds = results.data && results.data.bounds;
        $('prev').disabled = Boolean(bounds && bounds.oldest && dateKey(p.from) <= bounds.oldest);
        app.viewState.redraw = null;

        if (results.error) {
          target.innerHTML = `<p class="empty">${esc(results.error === 'update' ? T.needsUpdate : T.historyUnavailable)}</p>`;
          return;
        }
        if (!results.data) {
          target.innerHTML = `<p class="empty">${esc(T.historyLoading)}</p>`;
          return;
        }

        let items;
        if (results.mode === 'day') {
          const key = dateKey(p.from);
          const byHour = new Map(results.data.hours.filter(h => h.date === key).map(h => [h.hour, h]));
          items = Array.from({ length: 24 }, (_, hour) => ({
            ...(byHour.get(hour) || {}),
            short: String(hour),
            title: `${String(hour).padStart(2, '0')}:00 – ${String((hour + 1) % 24).padStart(2, '0')}:00`,
          }));
        } else {
          const byDay = new Map(results.data.days.map(d => [d.date, d]));
          items = [];
          for (let d = p.from; dateKey(d) <= dateKey(p.to); d = addDays(d, 1)) {
            items.push({
              ...(byDay.get(dateKey(d)) || {}),
              short: results.mode === 'week' ? d.toLocaleDateString(locale, { weekday: 'short' }).replace('.', '') : String(d.getDate()),
              title: capitalize(d.toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long' })),
            });
          }
        }

        const sum = key => items.reduce((total, item) => total + (num(item[key]) || 0), 0);
        const heat = sum('heat');
        const cooling = sum('cooling');
        const boiler = sum('boiler');
        const electrical = sum('electrical');
        const heatingInput = sum('heatingInput');
        const coolingInput = sum('coolingInput');
        if (!heat && !cooling && !boiler && !electrical) {
          target.innerHTML = `<p class="empty">${esc(T.historyEmpty)}</p>`;
          return;
        }
        const useEer = cooling > heat;
        const efficiency = useEer ? (coolingInput ? cooling / coolingInput : null) : (heatingInput ? heat / heatingInput : null);
        const kwh = wh => qtyHtml(wh / 1000, 'kWh', wh >= 100000 ? 0 : 1);
        const air = heat > 0 && heatingInput > 0 ? clamp((heat - heatingInput) / heat, 0, 1) : null;
        target.innerHTML = `
          <div class="stats four">
            <div class="stat green"><p class="stat-label">${esc(useEer ? T.averageEer : T.averageCop)}</p><p class="stat-value">${qtyHtml(efficiency, '', 2)}</p><p class="stat-note">${esc(p.label)}</p></div>
            <div class="stat blue"><p class="stat-label">${esc(T.electricUsed)}</p><p class="stat-value">${kwh(electrical)}</p><p class="stat-note">${esc(T.electricUsedNote)}</p></div>
            <div class="stat orange"><p class="stat-label">${esc(T.hpDelivered)}</p><p class="stat-value">${kwh(heat + cooling)}</p><p class="stat-note">${esc(T.hpDeliveredNote)}</p></div>
            <div class="stat"><p class="stat-label">${esc(T.boilerDelivered)}</p><p class="stat-value">${kwh(boiler)}</p><p class="stat-note">${esc(T.boilerDeliveredNote)}</p></div>
          </div>
          ${air === null ? '' : `<div class="share">
            <div class="share-bar"><i style="width:${((1 - air) * 100).toFixed(1)}%;background:var(--amber)"></i><i style="width:${(air * 100).toFixed(1)}%;background:var(--emerald)"></i></div>
            <div class="share-legend">
              <span><i class="dot" style="background:var(--emerald)"></i>${esc(T.fromAir(`${nf(air * 100)}%`))}</span>
              <span><i class="dot" style="background:var(--amber)"></i>${esc(T.fromElectric(`${nf((1 - air) * 100)}%`))}</span>
            </div>
          </div>`}
          <div class="chart-card">
            <div class="chart-head">
              <h4>${esc(p.label)}</h4>
              <div class="legend">
                <span><i style="background:var(--amber)"></i>${esc(T.legendElectric)}</span>
                <span><i style="background:var(--emerald)"></i>${esc(T.legendHeat)}</span>
                <span><i style="background:var(--blue)"></i>${esc(T.legendCool)}</span>
                <span><i style="background:var(--slate)"></i>${esc(T.legendBoiler)}</span>
              </div>
            </div>
            <div class="chart" id="bars"></div>
          </div>`;
        const draw = () => barChart($('bars'), { items });
        draw();
        app.viewState.redraw = draw;
      },
    };

    // --- Trends ------------------------------------------------------------------

    const trends = { data: null, error: null, loadedAt: 0 };

    async function loadTrends(force = false) {
      if (!force && trends.data && Date.now() - trends.loadedAt < SLOW_POLL_MS) return;
      trends.loadedAt = Date.now();
      try {
        const result = await call('/remote/history', { token: session.token });
        if (result.error === 'unauthorized') { signedOut(); return; }
        trends.data = result.history || null;
        trends.error = null;
      } catch (err) {
        trends.error = err.status === 404 ? 'update' : 'unavailable';
      }
      if (app.view === 'trends') VIEWS.trends.renderCharts();
    }

    VIEWS.trends = {
      entities: () => [...CORE_IDS],
      build() {
        const card = (id, title, legend) => `<div class="chart-card">
          <div class="chart-head"><h4>${esc(title)}</h4><div class="legend">${legend.map(([label, color, dashed]) => `<span><i class="${dashed ? 'dashed' : ''}" style="background:${color};color:${color}"></i>${esc(label)}</span>`).join('')}</div></div>
          <div class="chart" id="${id}"><p class="empty">${esc(T.loading)}</p></div>
        </div>`;
        return `<section class="panel">
          <p class="kicker">${esc(T.trendsKicker)}</p>
          <h2>${esc(T.trendsTitle)}</h2>
          <p class="panel-lead">${esc(T.trendsLead)} <span id="trends-since"></span></p>
          <div class="stats four" id="trend-stats" style="margin-top:16px"></div>
          <div id="trend-body">
            ${card('c-water', T.waterTemps, [[T.supply, '#ea580c'], [T.return, '#2563eb'], [T.supplyTarget, '#f59e0b', true]])}
            ${card('c-comfort', T.comfort, [[T.room, '#16a34a'], [T.roomSetpoint, '#94a3b8', true], [T.outside, '#0284c7']])}
            ${card('c-power', T.power, [[T.heatOutput, '#ea580c'], [T.electrical, '#2563eb']])}
            ${card('c-comp', T.compressors, [['HP1', '#7c3aed'], ['HP2', '#0ea5e9']])}
          </div>
        </section>`;
      },
      mounted() {
        if (trends.data) this.renderCharts();
        loadTrends();
      },
      update() { loadTrends(); },
      renderCharts() {
        const body = $('trend-body');
        if (!body) return;
        app.viewState.redraw = null;
        if (trends.error && !trends.data) {
          body.innerHTML = `<p class="empty">${esc(trends.error === 'update' ? T.needsUpdate : T.unreachable)}</p>`;
          return;
        }
        if (!trends.data) return;
        const { fields, rows, interval } = trends.data;
        const col = name => rows.map(r => r[fields.indexOf(name) + 1]);
        const times = rows.map(r => r[0] + interval / 2);
        const end = Date.now();
        const start = end - 24 * 3600000;
        // Only worth saying while the history does not cover the day yet.
        $('trends-since').textContent = rows.length && rows[0][0] > start + 3600000 ? T.trendsSince(clock(new Date(rows[0][0]), false)) : '';

        const avg = values => {
          const list = values.filter(v => num(v) !== null);
          return list.length ? list.reduce((a, b) => a + b, 0) / list.length : null;
        };
        const energy = values => (values.reduce((total, v) => total + (num(v) || 0), 0) * (interval / 3600000)) / 1000;
        const heat = col('heat');
        const cool = col('cool');
        const used = energy(col('power'));
        const delivered = energy(heat) + energy(cool);
        $('trend-stats').innerHTML = [
          ['sky', T.avgOutside, qtyHtml(avg(col('outside')), '°C', 1)],
          ['green', T.avgRoom, qtyHtml(avg(col('room')), '°C', 1)],
          ['blue', T.energyUsed, qtyHtml(used, 'kWh', 1)],
          ['orange', T.cop24, used > 0.05 ? qtyHtml(delivered / used, '', 1) : '—'],
        ].map(([tone, label, value]) => `<div class="stat ${tone}"><p class="stat-label">${esc(label)}</p><p class="stat-value">${value}</p></div>`).join('');

        if (rows.length < 2) {
          for (const id of ['c-water', 'c-comfort', 'c-power', 'c-comp']) $(id).innerHTML = `<p class="empty">${esc(T.trendsBuilding)}</p>`;
          return;
        }
        const output = heat.map((v, i) => (num(v) === null && num(cool[i]) === null ? null : (v || 0) + (cool[i] || 0)));
        const draw = () => {
          lineChart($('c-water'), {
            times,
            start,
            end,
            unit: '°C',
            decimals: 1,
            series: [
              { label: T.supply, color: '#ea580c', values: col('supply') },
              { label: T.return, color: '#2563eb', values: col('return') },
              { label: T.supplyTarget, color: '#f59e0b', values: col('target'), dashed: true },
            ],
          });
          lineChart($('c-comfort'), {
            times,
            start,
            end,
            unit: '°C',
            decimals: 1,
            series: [
              { label: T.room, color: '#16a34a', values: col('room') },
              { label: T.roomSetpoint, color: '#94a3b8', values: col('setpoint'), dashed: true },
              { label: T.outside, color: '#0284c7', values: col('outside') },
            ],
          });
          lineChart($('c-power'), {
            times,
            start,
            end,
            unit: 'W',
            zero: true,
            series: [
              { label: T.heatOutput, color: '#ea580c', values: output, area: true },
              { label: T.electrical, color: '#2563eb', values: col('power'), area: true },
            ],
          });
          lineChart($('c-comp'), {
            times,
            start,
            end,
            unit: 'Hz',
            zero: true,
            height: 170,
            series: [
              { label: 'HP1', color: '#7c3aed', values: col('hp1') },
              { label: 'HP2', color: '#0ea5e9', values: col('hp2') },
            ].filter(s => s.values.some(v => num(v) !== null)),
          });
        };
        draw();
        app.viewState.redraw = draw;
      },
    };

    // --- All values ------------------------------------------------------------------

    const DOMAIN_ORDER = ['sensor', 'binary_sensor', 'text_sensor', 'switch', 'select', 'number'];

    VIEWS.all = {
      entities: () => true,
      build() {
        return `<section class="panel">
          <p class="kicker">${esc(T.allKicker)}</p>
          <h2>${esc(T.allTitle)} <span class="muted" style="font-size:1rem;font-weight:600" id="all-count"></span></h2>
          <p class="panel-lead">${esc(T.allLead)}</p>
          <input class="search" id="search" type="search" autocomplete="off" placeholder="${esc(T.search)}">
          <div class="groups" id="groups"><p class="empty">${esc(T.loading)}</p></div>
        </section>`;
      },
      mounted() {
        $('search').addEventListener('input', () => this.update());
      },
      update() {
        if (!app.entities.size) return;
        const query = $('search').value.trim().toLowerCase();
        const groups = {};
        let total = 0;
        for (const [id, entity] of app.entities) {
          if (entity.state === null || entity.state === undefined) continue;
          const separator = id.indexOf('-');
          const domain = id.slice(0, separator);
          const name = entity.name || id.slice(separator + 1);
          total++;
          if (query && !`${name} ${entity.state}`.toLowerCase().includes(query)) continue;
          const key = DOMAIN_ORDER.includes(domain) ? domain : 'other';
          (groups[key] = groups[key] || []).push([name, entity.state]);
        }
        $('all-count').textContent = `· ${total}`;
        const html = [...DOMAIN_ORDER, 'other'].filter(key => groups[key]).map(key => `<div class="group"><h4>${esc(T.domains[key])}</h4><div class="list compact">${
          groups[key].sort((a, b) => a[0].localeCompare(b[0], locale, { numeric: true })).map(([name, state]) => row(name, state)).join('')
        }</div></div>`).join('');
        patch($('groups'), html || `<p class="empty">${esc(T.nothing)}</p>`);
      },
    };

    // --- Shell -------------------------------------------------------------------

    function renderTabs() {
      $('tabs').innerHTML = Object.keys(VIEWS).map(view => `<button class="tab ${view === app.view ? 'is-active' : ''}" type="button" role="tab" aria-selected="${view === app.view}" data-view="${view}">${icon(view)}${esc(T.tabs[view])}</button>`).join('');
    }

    function renderView() {
      const view = VIEWS[app.view];
      app.viewState.redraw = null;
      const main = $('view');
      main.innerHTML = view.build();
      bind(main);
      if (view.mounted) view.mounted();
      if (app.snapshot) view.update();
    }

    function selectView(name) {
      if (!VIEWS[name] || name === app.view) return;
      app.view = name;
      storage.set(TAB_KEY, name);
      renderTabs();
      renderView();
      window.scrollTo({ top: 0 });
      poll();
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-view], [data-go]');
      if (target) selectView(target.dataset.view || target.dataset.go);
    });

    function renderChrome() {
      const snapshot = app.snapshot;
      let cls = '';
      let text = T.liveConnecting;
      if (app.failing && app.lastOk) {
        cls = 'is-stale';
        text = T.liveStale(clock(app.lastOk, false));
      } else if (snapshot && snapshot.available === false) {
        cls = 'is-off';
        text = T.liveOffline;
      } else if (snapshot) {
        cls = 'is-ok';
        text = T.liveOk;
      }
      $('live').className = `live ${cls}`;
      $('live').textContent = text;

      const name = snapshot && snapshot.name && !/^openquatt$/i.test(snapshot.name) ? ` · ${snapshot.name}` : '';
      $('lead').textContent = `${T.lead}${name}`;

      const banners = [];
      if (app.failing) banners.push(['', T.staleTitle, [app.lastOk ? T.staleCopy(clock(app.lastOk, false)) : T.unreachable]]);
      if (snapshot && snapshot.available === false) banners.push(['', T.offlineTitle, [T.offlineCopy]]);
      const list = snapshot ? problems() : [];
      if (list.length) banners.push(['is-danger', T.problemsTitle, list]);
      patch($('banners'), banners.map(([tone, title, lines]) => `<div class="banner ${tone}"><strong>${esc(title)}</strong>${
        lines.length > 1 ? `<ul>${lines.map(line => `<li>${esc(line)}</li>`).join('')}</ul>` : `<p>${esc(lines[0])}</p>`
      }</div>`).join(''));

      const version = et(ID.version);
      $('foot').innerHTML = [
        esc(version ? `OpenQuatt ${version}` : 'OpenQuatt'),
        esc(T.readOnly),
        app.lastOk ? esc(T.updated(clock(app.lastOk))) : '',
      ].filter(Boolean).join(' · ');
    }

    // --- Polling -------------------------------------------------------------------

    async function poll() {
      clearTimeout(app.timer);
      // A hidden tab does not poll; it catches up when it is shown again.
      if (!session.token || document.hidden) return;
      if (app.polling) {
        app.again = true;
        return;
      }
      app.polling = true;
      try {
        const result = await call('/remote/state', { token: session.token, entities: VIEWS[app.view].entities() });
        if (result.error) {
          signedOut();
          return;
        }
        app.snapshot = result.state;
        for (const entity of result.state.entities || []) app.entities.set(entity.id, entity);
        app.lastOk = new Date();
        app.failing = false;
        renderChrome();
        VIEWS[app.view].update();
      } catch (err) {
        app.failing = true;
        renderChrome();
      } finally {
        app.polling = false;
        if (session.token) app.timer = setTimeout(poll, app.again ? 0 : POLL_MS);
        app.again = false;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && session.token) poll();
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (app.viewState.redraw) app.viewState.redraw(); }, 150);
    });

    // --- Sign in / out ---------------------------------------------------------------

    function showLogin(message = '') {
      clearTimeout(app.timer);
      $('app').hidden = true;
      $('login').hidden = false;
      $('homey-id').value = session.homeyId || '';
      $('login-error').textContent = message;
      (session.homeyId ? $('username') : $('homey-id')).focus();
    }

    function showApp() {
      $('login').hidden = true;
      $('app').hidden = false;
      $('password').value = '';
      renderTabs();
      renderChrome();
      renderView();
      poll();
    }

    function forget() {
      session = { homeyId: session.homeyId };
      storage.set(STORE_KEY, session);
      app.snapshot = null;
      app.entities.clear();
      app.lastOk = null;
      app.failing = false;
      results.data = null;
      results.key = '';
      trends.data = null;
    }

    function signedOut() {
      forget();
      showLogin(T.expired);
    }

    $('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const homeyId = $('homey-id').value.trim().toLowerCase();
      if (!HOMEY_ID.test(homeyId)) {
        $('login-error').textContent = T.invalidId;
        return;
      }
      session = { homeyId };
      const button = $('sign-in');
      button.disabled = true;
      button.textContent = T.signingIn;
      $('login-error').textContent = '';
      try {
        const result = await call('/remote/login', { username: $('username').value, password: $('password').value });
        if (result.token) {
          session.token = result.token;
          storage.set(STORE_KEY, session);
          showApp();
        } else {
          $('login-error').textContent = T[result.error] || T.unauthorized;
        }
      } catch (err) {
        $('login-error').textContent = T.unreachable;
      } finally {
        button.disabled = false;
        button.textContent = T.signIn;
      }
    });

    $('sign-out').addEventListener('click', () => {
      call('/remote/logout', { token: session.token }).catch(() => {});
      forget();
      showLogin();
    });

    // --- Start ---------------------------------------------------------------------

    for (const logo of document.querySelectorAll('[data-logo]')) logo.innerHTML = LOGO;
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
    $('sign-out').innerHTML = icon('signOut', T.signOut);
    $('sign-out').title = T.signOut;
    if (!VIEWS[app.view]) app.view = 'overview';

    if (session.homeyId && session.token) showApp();
    else showLogin();
  </script>
</body>
</html>
